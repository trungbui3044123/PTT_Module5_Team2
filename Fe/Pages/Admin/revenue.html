<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Quản lý doanh thu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 bg-dark text-white min-vh-100 p-3">
            <h2 class="text-center mb-4">Admin Panel</h2>

            <ul class="nav flex-column">
                <li class="nav-item mb-2">
                    <a href="./index.html" class="nav-link text-white">Dashboard</a>
                </li>

                <li class="nav-item mb-2">
                    <a href="./userList.html" class="nav-link text-white">List Users</a>
                </li>

                <li class="nav-item mb-2">
                    <a href="./note_staff_list.html" class="nav-link text-white">Note</a>
                </li>

                <li class="nav-item mb-2">
                    <a href="./revenue.html" class="nav-link text-white">Revenue</a>
                </li>

                <li class="nav-item mt-3">
                    <a href="../../Login.html" class="btn btn-danger w-100">Logout</a>
                </li>
            </ul>
        </div>

        <!-- Content -->
        <div class="col-md-9 col-lg-10 p-4">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold">Doanh thu cửa hàng</h2>
                <div>
                    <button class="btn btn-outline-primary btn-custom me-2" onclick="changeSort('asc')">⬆ Tăng</button>
                    <button class="btn btn-outline-danger btn-custom" onclick="changeSort('desc')">⬇ Giảm</button>
                </div>
            </div>

            <!-- Table -->
            <div class="card shadow-sm p-3">
                <table class="table table-hover text-center align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Tên cửa hàng</th>
                        <th>Tổng doanh thu</th>
                        <th>Doanh thu hệ thống (3%)</th>
                    </tr>
                    </thead>
                    <tbody id="tableBody">
                    <tr><td colspan="4">Loading...</td></tr>
                    </tbody>
                </table>

                <!-- Pagination -->
                <div class="d-flex justify-content-between align-items-center mt-3">
                    <button class="btn btn-secondary" onclick="prevPage()">← Previous</button>
                    <span id="pageInfo"></span>
                    <button class="btn btn-secondary" onclick="nextPage()">Next →</button>
                </div>
            </div>

        </div>

    </div>
</div>

<script>
    const API = "http://localhost:8080";
    const token = sessionStorage.getItem("token");

    if (!token) {
        window.location.href = "../../Login.html";
    }

    let page = 0;
    let size = 5;
    let sort = "desc";
    let totalPages = 0;

    async function loadRevenue() {
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = `<tr><td colspan="4">Đang tải...</td></tr>`;

        try {
            const res = await fetch(`${API}/api/revenue/admin?page=${page}&size=${size}&sort=${sort}`, {
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            if (!res.ok) {
                throw new Error("Server error: " + res.status);
            }

            const data = await res.json();

            if (!data || !data.data || !data.data.content) {
                throw new Error("API trả về không đúng format");
            }

            const list = data.data.content;

            tbody.innerHTML = "";

            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4">Không có dữ liệu</td></tr>`;
                return;
            }

            list.forEach(item => {
                tbody.innerHTML += `
                <tr>
                    <td>${item.id}</td>
                    <td>${item.name}</td>
                    <td>${formatMoney(item.totalRevenue)}</td>
                    <td>${formatMoney(item.adminRevenue)}</td>
                </tr>
            `;
            });

            totalPages = data.data.totalPages;

            document.getElementById("pageInfo").innerText =
                `Page ${data.data.number + 1} / ${data.data.totalPages}`;

        } catch (err) {
            console.error("Lỗi load revenue:", err);
            tbody.innerHTML = `<tr><td colspan="4">Lỗi tải dữ liệu</td></tr>`;
        }
    }

    function changeSort(direction) {
        sort = direction;
        page = 0;
        loadRevenue();
    }

    function nextPage() {
        if (page < totalPages - 1) {
            page++;
            loadRevenue();
        }
    }

    function prevPage() {
        if (page > 0) {
            page--;
            loadRevenue();
        }
    }

    function formatMoney(value) {
        return Number(value).toLocaleString("vi-VN") + " VND";
    }

    loadRevenue();
</script>

</body>
</html>
