<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        /* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

/* Layout tổng */
body {
    background: #f4f6f9;
    display: flex;
}

/* Sidebar trái */
.sidebar {
    width: 240px;
    height: 100vh;
    background: #2c3e50;
    color: white;
    padding: 20px;
    position: fixed;
    left: 0;
    top: 0;
}

.sidebar h2 {
    margin-bottom: 30px;
    font-size: 22px;
    text-align: center;
}

.sidebar ul {
    list-style: none;
}

.sidebar ul li {
    margin-bottom: 18px;
}

.sidebar ul li a {
    text-decoration: none;
    color: #ecf0f1;
    font-size: 16px;
    display: block;
    padding: 10px 12px;
    border-radius: 6px;
    transition: 0.2s;
}

.sidebar ul li a:hover {
    background: #34495e;
}

/* Nội dung chính */
.content {
    margin-left: 260px; /* chừa chỗ cho sidebar */
    padding: 20px;
    width: calc(100% - 260px);
}

/* Nút Logout */
#Logout {
    background: #e74c3c;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    float: right;
    transition: 0.2s;
}

#Logout:hover {
    background: #c0392b;
}

/* Nút user list */
#userList {
    background: #3498db;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.2s;
}

#userList:hover {
    background: #2980b9;
}

/* Link tạo staff */
h3 a {
    text-decoration: none;
    color: #27ae60;
    font-size: 20px;
    font-weight: bold;
    transition: 0.2s;
}

h3 a:hover {
    color: #1e8449;
}

    </style>
</head>
<body>
<div class="sidebar">
    <h2>Admin Panel</h2>
    <ul>
        <li><a href="#">Dashboard</a></li>
        <li><a href="/Fe/Pages/Admin/userList.html">List Users</a></li>
        <!-- <li><a href="/Fe/Pages/Admin/registerStaff.html">Create Staff</a></li> -->
        <li><a href="/Fe/Pages/Admin/Login.html">Logout</a></li>
    </ul>
</div>

<div class="content">
    <div><h1>Dashboard</h1></div>



</div>
<script>
    const token = sessionStorage.getItem("token");

if (!token) {
    window.location.href = "/Fe/Pages/Admin/Login.html";
}





</script>
</body>
</html>
