<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Details User</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <div class="container py-4">
        <!-- Back to list -->
        <div class="mb-3">
          <button id="listUser" class="btn btn-secondary">List users</button>
        </div>

        <!-- Username -->
        <div class="d-flex justify-content-end mb-2">
          <p class="fw-semibold text-secondary" id="loginUser"></p>
        </div>

        <h1 id="title" class="mb-4"></h1>

        <div class="main">
          <div id="error" class="text-danger mb-3"></div>

          <form id="detailsForm" class="p-4 border rounded bg-light">
            <div id="contentsForm" class="row g-4">
              <!-- Left Column -->
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="username" class="form-label">User name *</label>
                  <input
                    type="text"
                    id="username"
                    name="username"
                    maxlength="100"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="email" class="form-label">Email *</label>
                  <input
                    type="email"
                    id="email"
                    name="email"
                    maxlength="150"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="name" class="form-label">Name</label>
                  <input
                    type="text"
                    id="name"
                    name="name"
                    maxlength="150"
                    class="form-control"
                  />
                </div>

                <div class="mb-3">
                  <label for="age" class="form-label">Age</label>
                  <input
                    type="number"
                    id="age"
                    name="age"
                    min="0"
                    class="form-control"
                  />
                </div>
              </div>

              <!-- Right Column -->
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="phone" class="form-label">Phone *</label>
                  <input
                    type="text"
                    id="phone"
                    name="phone"
                    maxlength="20"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="address" class="form-label">Address</label>
                  <input
                    type="text"
                    id="address"
                    name="address"
                    maxlength="255"
                    class="form-control"
                  />
                </div>

                <div class="mb-3">
                  <label for="salary" class="form-label" id="salaryLabel">Salary *</label>
                  <input
                    type="number"
                    id="salary"
                    name="salary"
                    min="1"
                    max="99999999"
                    class="form-control"
                    required
                  />
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="role" class="form-label">Role</label>
                    <input type="text" disabled  class="form-control" id="role" name="role">
                  </div>

                  <div class="col-md-6 mb-3" id="adminStatus">
                    <label for="status" class="form-label">Status</label>
                    <select name="status" id="status" class="form-select">
                      <option value="BANNED">BANNED</option>
                      <option value="ACTIVE">ACTIVE</option>
                      <option value="BLOCK">BLOCK</option>
                    </select>
                   
                  </div>
                </div>
              </div>
            </div>

            <!-- Buttons -->
            <div class="mt-4 d-flex justify-content-center gap-3">
              
              <button
                type="button"
                id="resetbtn"
                onclick="resetPass(event)"
                class="btn btn-outline-info"
              >
                Reset Staff's Password
              </button>
              <button
                type="button"
                id="editbtn"
                onclick="toEditForm(event)"
                class="btn btn-outline-info"
              >
                Edit
              </button>
              <button
                type="button"
                id="delbtn"
                onclick="deleteBtn(event)"
                class="btn btn-outline-danger"
              >
                Delete user
              </button>

<!--              <h4 id="error" class="text-danger mt-3" style="display: none">-->
<!--                Register fails-->
<!--              </h4>-->
            </div>
          
          </form>
        </div>
      </div>
    </main>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // validate
      const token = sessionStorage.getItem("token");
      const loginusername = sessionStorage.getItem("username");
      const role = sessionStorage.getItem("role");

      if (!token || role !== "ADMIN") {
        window.location.href = "../../Login.html";
      }

      document.getElementById("loginUser").innerHTML = `Xin chào, ${loginusername}`;

      // get ID
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      console.log(id); // ví dụ: 123
      //   get DOM
      const editDetailsBtn = document.getElementById("editDetailsBtn");
      const contentsForm = document.getElementById("contentsForm");
      let contents = {
        username: document.getElementById("username"),
        email: document.getElementById("email"),
        phone: document.getElementById("phone"),
        name: document.getElementById("name"),
        age: document.getElementById("age"),
        role: document.getElementById("role"),
        address: document.getElementById("address"),
        status: document.getElementById("status"),
        salary: document.getElementById("salary"),
      };
      const title = document.getElementById("title");
      // Gen details data
      fetch(`http://localhost:8080/api/admin/users/${id}`, {
        method: "GET",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token,
        },
      })
        .then((res) => res.json())
        .then((res) => {
          if (res.status !== 200) {
            contentsForm.innerHTML = "<h3>Not found data</h3>";
          } else {
            const details = res.data;
            console.log(details)
            title.innerHTML = `Details  information of ${details.username}`;
            contents.username.value = details.username;
            contents.email.value = details.email;
            contents.phone.value = details.phone;
            contents.name.value = details.name;
            contents.age.value = details.age;
            contents.role.value = details.role;
            contents.address.value = details.address;
            contents.status.value = details.status;
            if(details.role==="STAFF"){
              contents.salary.value = details.salary;
            }else if(details.role==="ADMIN"){
              document.getElementById("resetbtn").style.display="none";
              document.getElementById("delbtn").style.display="none";
              document.getElementById("editbtn").style.display="none";
              document.getElementById("adminStatus").style.display="none";
            }
            else{
              contents.salary.style.display="none";
              document.getElementById("salaryLabel").style.display="none";
               document.getElementById("resetbtn").style.display="none";

            }
            
          }
        });
      // backhome page
      document
        .getElementById("listUser")
        .addEventListener("click", function (e) {
          e.preventDefault();
          window.location.href = "./userList.html";
        });

        // functions
        function resetPass(e){
          e.preventDefault();
          
        fetch(`http://localhost:8080/api/admin/users/staff/${id}/reset-password`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token,
        }
      })
        .then((res) => res.json())
        .then((res) => { console.log(res.status)
          if(res.status===200){
            alert("Reset password done. New password is sent to staff's email");

          }

        .catch((err) => { 
          document.getElementById("error").style.display="block";
          document.getElementById("error").innerHTML=`${err}`

      //end
        }
                 
        function toEditForm(e){
          e.preventDefault();
          const editData={
        username: document.getElementById("username").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        name: document.getElementById("name").value,
        age: document.getElementById("age").value,
        address: document.getElementById("address").value,
        status: document.getElementById("status").value,
        salary: document.getElementById("salary").value,
          }

        if(!confirm("Edit this user?")){
       
         location.reload();
      }else{ 
        fetch(`http://localhost:8080/api/admin/users/${id}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token,
        },
        body: JSON.stringify(editData)
      })
        .then((res) => res.json())
        .then((res) => {
          if(res.status===200){
           alert("Edit user infor sucess");
           location.reload();
          }
        })
        .catch((err) => { 
          document.getElementById("error").style.display="block";
          document.getElementById("error").innerHTML=`${err}`
          console.error("Error:", err); })
      }
        //end
         }

        }
      })
        .then((res) => res.json())
        .then((res) => { console.log(res.status)

          }

          document.getElementById("error").innerHTML=`${err}`

          //end
          }}
      //
    </script>
  </body>
</html>
