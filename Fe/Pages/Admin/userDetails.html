<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Details User</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <div class="container py-4">
        <!-- Back to list -->
        <div class="mb-3">
          <button id="listUser" class="btn btn-secondary">List users</button>
        </div>

        <!-- Username -->
        <div class="d-flex justify-content-end mb-2">
          <p class="fw-semibold text-secondary" id="loginUser"></p>
        </div>

        <h1 id="title" class="mb-4"></h1>

        <div class="main">
          <div id="error" class="text-danger mb-3"></div>

          <form id="detailsForm" class="p-4 border rounded bg-light">
            <div id="contentsForm" class="row g-4">
              <!-- Left Column -->
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label">Username *</label>
                  <input type="text" id="username" class="form-control" required maxlength="50">
                  <div class="invalid-feedback">Username không được để trống</div>
                </div>

                <div class="mb-3">
                  <label class="form-label">Email</label>
                  <input type="email" id="email" class="form-control" disabled>
                </div>

                <div class="mb-3">
                  <label class="form-label">Name *</label>
                  <input type="text" id="name" class="form-control" required maxlength="150">
                  <div class="invalid-feedback">Name không được để trống</div>
                </div>

                <div class="mb-3">
                  <label class="form-label">Age *</label>
                  <input type="number" id="age" class="form-control"
                         required min="19" max="59">
                  <div class="invalid-feedback">Tuổi phải từ 19 đến 59</div>
                </div>
              </div>

              <!-- Right Column -->
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label">Phone *</label>
                  <input type="text" id="phone" class="form-control"
                         required maxlength="20"
                         pattern="^(0|\+84)[0-9]{9}$">
                  <div class="invalid-feedback">Số điện thoại không hợp lệ</div>
                </div>

                <div class="mb-3">
                  <label class="form-label">Address *</label>
                  <input type="text" id="address" class="form-control"
                         required maxlength="255">
                  <div class="invalid-feedback">Address không được để trống</div>
                </div>

                <div class="mb-3">
                  <label class="form-label">Salary</label>
                  <input type="number" id="salary" class="form-control"
                         min="1000" max="99999999">
                  <div class="invalid-feedback">
                    Salary phải >= 1000 và tối đa 8 chữ số
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="role" class="form-label">Role</label>
                    <input type="text" disabled  class="form-control" id="role" name="role">
                  </div>

                  <div class="col-md-6 mb-3" id="adminStatus">
                    <label for="status" class="form-label">Status</label>
                    <select name="status" id="status" class="form-select">
                      <option value="BANNED">BANNED</option>
                      <option value="ACTIVE">ACTIVE</option>
                      <option value="BLOCK">BLOCK</option>
                    </select>

                  </div>
                </div>
              </div>
            </div>

            <!-- Buttons -->
            <div class="mt-4 d-flex justify-content-center gap-3">

              <button
                type="button"
                id="resetbtn"
                onclick="resetPass(event)"
                class="btn btn-outline-info"
              >
                Reset Staff's Password
              </button>
              <button
                type="button"
                id="editbtn"
                onclick="toEditForm(event)"
                class="btn btn-outline-info"
              >
                Edit
              </button>
              <button
                type="button"
                id="delbtn"
                onclick="deleteBtn(event)"
                class="btn btn-outline-danger"
              >
                Delete user
              </button>

<!--              <h4 id="error" class="text-danger mt-3" style="display: none">-->
<!--                Register fails-->
<!--              </h4>-->
            </div>

          </form>
        </div>
      </div>
    </main>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // validate
      const token = sessionStorage.getItem("token");
      const loginusername = sessionStorage.getItem("username");
      const role = sessionStorage.getItem("role");

      if (!token || role !== "ADMIN") {
        window.location.href = "../../Login.html";
      }

      document.getElementById("loginUser").innerHTML = `Xin chào, ${loginusername}`;

      // get ID
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      console.log(id); // ví dụ: 123
      //   get DOM
      const editDetailsBtn = document.getElementById("editDetailsBtn");
      const contentsForm = document.getElementById("contentsForm");
      let contents = {
        username: document.getElementById("username"),
        email: document.getElementById("email"),
        phone: document.getElementById("phone"),
        name: document.getElementById("name"),
        age: document.getElementById("age"),
        role: document.getElementById("role"),
        address: document.getElementById("address"),
        status: document.getElementById("status"),
        salary: document.getElementById("salary"),
      };
      const title = document.getElementById("title");
      // Gen details data
      fetch(`http://localhost:8080/api/admin/users/${id}`, {
        method: "GET",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token,
        },
      })
        .then((res) => res.json())
        .then((res) => {
          if (res.status !== 200) {
            contentsForm.innerHTML = "<h3>Not found data</h3>";
          } else {
            const details = res.data;
            console.log(details)
            title.innerHTML = `Details  information of ${details.username}`;
            contents.username.value = details.username;
            contents.email.value = details.email;
            contents.phone.value = details.phone;
            contents.name.value = details.name;
            contents.age.value = details.age;
            contents.role.value = details.role;
            contents.address.value = details.address;
            contents.status.value = details.status;
            if(details.role==="STAFF"){
              contents.salary.value = details.salary;
            }else if(details.role==="ADMIN"){
              document.getElementById("resetbtn").style.display="none";
              document.getElementById("delbtn").style.display="none";
              document.getElementById("editbtn").style.display="none";
              document.getElementById("adminStatus").style.display="none";
            }
            else{
              contents.salary.style.display="none";
              document.getElementById("salaryLabel").style.display="none";
               document.getElementById("resetbtn").style.display="none";

            }

          }
        });
      // backhome page
      document
        .getElementById("listUser")
        .addEventListener("click", function (e) {
          e.preventDefault();
          window.location.href = "./userList.html";
        });

        // functions
        function resetPass(e){
          e.preventDefault();

        fetch(`http://localhost:8080/api/admin/users/staff/${id}/reset-password`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token,
        }
      })
        .then((res) => res.json())
        .then((res) => { console.log(res.status)
          if(res.status===200){
            alert("Reset password done. New password is sent to staff's email");
            location.reload();
          }else{
             document.getElementById("error").style.display="block";
          document.getElementById("error").innerHTML=`${err}`
          }
        })
        .catch((err) => {
          document.getElementById("error").style.display="block";
          document.getElementById("error").innerHTML=`${err}`
          console.error("Error:", err); })
      //end
        }

      function toEditForm(e) {
        e.preventDefault();

        const form = document.getElementById("detailsForm");
        const errorDiv = document.getElementById("error");

        errorDiv.classList.remove("text-danger");
        errorDiv.classList.add("alert", "alert-danger", "d-none");
        errorDiv.innerHTML = "";

        form.classList.remove("was-validated");

        const roleValue = contents.role.value;

        // STAFF thì salary bắt buộc
        if (roleValue === "STAFF") {
          contents.salary.setAttribute("required", "true");
        } else {
          contents.salary.removeAttribute("required");
        }

        // Bootstrap HTML5 validation
        if (!form.checkValidity()) {
          form.classList.add("was-validated");
          showValidationErrors();
          return;
        }

        const editData = {
          username: contents.username.value.trim(),
          email: contents.email.value,
          phone: contents.phone.value.trim(),
          name: contents.name.value.trim(),
          age: parseInt(contents.age.value),
          address: contents.address.value.trim(),
          status: contents.status.value,
          salary: roleValue === "STAFF"
                  ? parseFloat(contents.salary.value)
                  : null
        };

        if (!confirm("Edit this user?")) return;

        fetch(`http://localhost:8080/api/admin/users/${id}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token,
          },
          body: JSON.stringify(editData),
        })
                .then((res) => res.json())
                .then((res) => {
                  if (res.status === 200) {
                    alert("Edit user info success");
                    location.reload();
                  } else {
                    showGlobalError(res.message || "Update failed");
                  }
                })
                .catch(() => showGlobalError("Server error"));
      }

      function showValidationErrors() {
        const form = document.getElementById("detailsForm");
        const errorDiv = document.getElementById("error");

        let messages = [];
        const inputs = form.querySelectorAll("input, select");

        inputs.forEach(input => {
          if (!input.checkValidity()) {
            messages.push(input.validationMessage);
          }
        });

        if (messages.length > 0) {
          errorDiv.classList.remove("d-none");
          errorDiv.innerHTML = `
      <strong>Vui lòng sửa các lỗi sau:</strong>
      <ul class="mb-0">
        ${messages.map(m => `<li>${m}</li>`).join("")}
      </ul>
    `;
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      }

      function showGlobalError(message) {
        const errorDiv = document.getElementById("error");
        errorDiv.classList.remove("d-none");
        errorDiv.innerText = message;
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

        function deleteBtn(event){
          if(confirm("Wanna delete this user?")){
        fetch(`http://localhost:8080/api/admin/users/${id}`, {
        method: "DELETE",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token,
        }
      })
        .then((res) => res.json())
        .then((res) => { console.log(res.status)
          if(res.status===200){
            window.location.href = "./userList.html";
          }else{
             document.getElementById("error").style.display="block";
          document.getElementById("error").innerHTML=`${err}`
          }
        })
        .catch((err) => {
          document.getElementById("error").style.display="block";
          document.getElementById("error").innerHTML=`${err}`
          console.error("Error:", err); })
          //end
          }}
      //
    </script>
  </body>
</html>
