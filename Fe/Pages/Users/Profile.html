<!doctype html>
<html lang="en">
 
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <div class="container py-4">
        <!-- Back to list -->
        <div class="mb-3 d-flex justify-content-between align-items-center">
          <button id="userHome" class="btn btn-link fs-4">Back Home Page</button>

          <p class="fw-semibold fs-5 text-secondary " id="loginUser"></p>
        </div>

        <h1 id="title" class="mb-4  text-center"></h1>

        <div class="main">
          <div id="error" class="text-danger mb-3"></div>

         <form id="detailsForm" class="p-4 border rounded bg-light">
            <div id="contentsForm" class="row g-4">
              <!-- Left Column -->
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="username" class="form-label">User name *</label>
                  <input
                    type="text"
                    id="username"
                    name="username"
                    maxlength="100"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="email" class="form-label">Email *</label>
                  <input
                    type="email"
                    id="email"
                    name="email"
                    maxlength="150"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="name" class="form-label">Name</label>
                  <input
                    type="text"
                    id="name"
                    name="name"
                    maxlength="150"
                    class="form-control"
                  />
                </div>

                <div class="mb-3">
                  <label for="age" class="form-label">Age</label>
                  <input
                    type="number"
                    id="age"
                    name="age"
                    min="0"
                    class="form-control"
                  />
                </div>
              </div>

              <!-- Right Column -->
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="phone" class="form-label">Phone *</label>
                  <input
                    type="text"
                    id="phone"
                    name="phone"
                    maxlength="20"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="address" class="form-label">Address</label>
                  <input
                    type="text"
                    id="address"
                    name="address"
                    maxlength="255"
                    class="form-control"
                  />
                </div>

                <div class="mb-3">
                  <label for="salary" class="form-label" id="salaryLabel">Salary *</label>
                  <input
                    type="number"
                    id="salary"
                    name="salary"
                    min="1"
                    max="99999999"
                    class="form-control"
                    required
                  />
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="role" class="form-label">Role</label>
                    <input type="text" disabled  class="form-control" id="role" name="role">
                  </div>

                  <div class="col-md-6 mb-3" id="adminStatus">
                    <label for="status" class="form-label">Status</label>
                    <input type="text" disabled  class="form-control" id="status" name="status">
                   
                  </div>
                </div>
              </div>
            </div>

            <!-- Buttons -->
            <div class="mt-4 d-flex justify-content-center gap-3">
              
            <button type="button" id="resetbtn" onclick="openChangePasswordDialog()" class="btn btn-outline-info" 
            > Reset Password 
          </button>
              

              <button
                type="button"
                id="editbtn"
                onclick="toEditForm(event)"
                class="btn btn-outline-info"
              >
                Edit
              </button>


<!--              <h4 id="error" class="text-danger mt-3" style="display: none">-->
<!--                Actions fails-->
<!--              </h4>-->
            </div>
          
          </form>
        </div>
      </div>
      <!-- Change Password Modal -->
<div class="modal fade" id="changePasswordModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <!-- Header -->
      <div class="modal-header">
        <h5 class="modal-title">Change password</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <!-- Body -->
      <div class="modal-body">
        <div id="passwordError" class="text-danger mb-2"></div>

        <form id="changePasswordForm">

          <div class="mb-3">
            <label class="form-label">Old password *</label>
            <input type="password" id="oldPassword" class="form-control" required />
          </div>

          <div class="mb-3">
            <label class="form-label">New password *</label>
            <input type="password" id="newPassword" class="form-control" required />
            <div class="form-text">
              ≥ 8 charactor, Uppercase, Lowwercase, Number and SpecialCase
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Confirm New password *</label>
            <input type="password" id="confirmPassword" class="form-control" required />
          </div>

        </form>
      </div>

      <!-- Footer -->
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="submitChangePassword()">Confirm</button>
      </div>

    </div>
  </div>
</div>

    </main>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // validate
      const token = sessionStorage.getItem("token");
      const loginusername = sessionStorage.getItem("username");
      const role = sessionStorage.getItem("role");

      if (!token) {
        window.location.href = "../../Login.html";
      }

      document.getElementById("loginUser").innerHTML = `Hello, ${loginusername}`;

     
      //   get DOM
      
      const contentsForm = document.getElementById("contentsForm");
      let contents = {
        username: document.getElementById("username"),
        email: document.getElementById("email"),
        phone: document.getElementById("phone"),
        name: document.getElementById("name"),
        age: document.getElementById("age"),
        role: document.getElementById("role"),
        address: document.getElementById("address"),
        status: document.getElementById("status"),
        salary: document.getElementById("salary"),
      };
      const title = document.getElementById("title");
      // Gen details data
      fetch(`http://localhost:8080/api/user/profile`, {
        method: "GET",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token,
        },
      })
        .then((res) => res.json())
        .then((res) => {
          if (res.status !== 200) {
            contentsForm.innerHTML = "<h3>Not found data</h3>";
          } else {
            const details = res.data;
            console.log(details)
            title.innerHTML = `Details  information of ${details.username}`;
            contents.username.value = details.username;
            contents.email.value = details.email;
            contents.phone.value = details.phone;
            contents.name.value = details.name;
            contents.age.value = details.age;
            contents.role.value = details.role;
            contents.address.value = details.address;
            contents.status.value = details.status;
            if(details.role==="STAFF"){
              contents.salary.value = details.salary;
            }else if(details.role==="ADMIN"){
              document.getElementById("resetbtn").style.display="none";
              document.getElementById("delbtn").style.display="none";
              document.getElementById("editbtn").style.display="none";
              document.getElementById("adminStatus").style.display="none";
            }
            else{
              contents.salary.style.display="none";
              document.getElementById("salaryLabel").style.display="none";
            }
            
          }
        });
        //
        function openChangePasswordDialog(e){
         
          const modal = new bootstrap.Modal(document.getElementById("changePasswordModal")); 
          modal.show();}

        function submitChangePassword(){
           let ChangePasswordRequest = {
              oldPassword: document.getElementById("oldPassword").value,
              newPassword : document.getElementById("newPassword").value,
              confirmPassword: document.getElementById("confirmPassword").value
           }
           const errorDiv = document.getElementById("passwordError"); errorDiv.innerHTML = "";  
           // Validate confirm 
           if (ChangePasswordRequest.newPassword !== ChangePasswordRequest.confirmPassword) { 
            errorDiv.innerHTML = "New password not match"; return; } // Regex validate new password 
            const regex = /^(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z])(?=.*[@#$%^&+=])(?=\S+$).{8,}$/; 
            if (!regex.test(ChangePasswordRequest.newPassword)) { errorDiv.innerHTML = "New password not valid"; return; }
            console.log(ChangePasswordRequest)
           
        fetch(`http://localhost:8080/api/user/change-password`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token,
        },
        body:JSON.stringify(ChangePasswordRequest)
      })
        .then((res) => res.json())
        .then((res) => { console.log(res.status)
          if(res.status===200){
            alert("Reset password done. New password is sent to staff's email");
            bootstrap.Modal.getInstance(document.getElementById("changePasswordModal")).hide();
            location.reload();
          }else{
            bootstrap.Modal.getInstance(document.getElementById("changePasswordModal")).hide();

          }
        })
        .catch((err) => { 
          bootstrap.Modal.getInstance(document.getElementById("changePasswordModal")).hide();
          document.getElementById("error").style.display="block";
          document.getElementById("error").innerHTML=`${err}`
          console.error("Error:", err); })
      //end
        }
                 
        function toEditForm(e){
          e.preventDefault();
        const salaryValue = document.getElementById("salary").value; 
          const editData={
        username: document.getElementById("username").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        name: document.getElementById("name").value,
        age: document.getElementById("age").value,
        address: document.getElementById("address").value,
        status: document.getElementById("status").value,
        salary: (salaryValue === "" || salaryValue === "0") ? Number(1000) : Number(salaryValue),
          }

        if(!confirm("Edit this user?")){
       
         location.reload();
      }else{ 
        fetch(`http://localhost:8080/api/user/profile`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token,
        },
        body: JSON.stringify(editData)
      })
        .then((res) => res.json())
        .then((res) => {
          if(res.status===200){
           alert("Edit user infor sucess");
           location.reload();
          }
        })
        .catch((err) => { 
          document.getElementById("error").style.display="block";
          document.getElementById("error").innerHTML=`${err}`
          console.error("Error:", err); })
      }
        //end
         }

      // backhome page
      document
        .getElementById("userHome")
        .addEventListener("click", function (e) {
          e.preventDefault();
          window.location.href = "../../Index.html";
        });

        
                 
        

      
      //
    </script>
  </body>
</html>
