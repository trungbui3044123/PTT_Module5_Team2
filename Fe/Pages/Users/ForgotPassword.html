<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Forgot password</title>
       
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

</head>
<body>
<main>

  <!-- Back button -->
    <div class="mb-3">
        <a id="homePage" class="btn btn-link fs-4"> Login Pages</a>
    </div>
    <div class="container mt-5" style="max-width: 450px;">
    <h2 class="text-center mb-4">Forgot password</h2>

    <div id="error" class="alert alert-danger" style="display: none;">
       Email not valid
    </div>
    <form id="loginForm" class="card p-4 shadow-sm">
        
        <div class="mb-3">
            <label for="email" class="form-label">Email *</label>
            <input 
                type="email" 
                id="email" 
                name="email" 
                maxlength="150" 
                required 
                class="form-control"
            >
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Reset password
        </button>
    </form>
</div>

</main>
<!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
   
document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const data = {
        email: document.getElementById("email").value
    };
   if(confirm("Save new password. Mật khẩu mới được gửi tới mail của bạn")){
    const res = await fetch("http://localhost:8080/api/public/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    });

    const result = await res.json();

    if (res.status === 200) {
        // Lưu token nếu BE trả về
       
       console.log("SUCCESS:", result);
          window.location.href = "../../Login.html";
    } else {
        console.log("ERROR:", result);
        const error = document.getElementById("error");
        error.style.display = "block";
        error.innerText =`${result.message || ""} ${result.data || ""}`.trim() || "Đổi pass thất bại";
    }
    }else{ location.reload(); }
});
      // backhome page
      document
        .getElementById("homePage")
        .addEventListener("click", function (e) {
          e.preventDefault();
          window.location.href = "./index.html";
        });
</script>

</body>
</html>
