<html lang="en">
  <head>

    <!-- Bootstrap CSS -->

      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"

    />
  </head>
  <body>
    <main>
      <div
        class="d-flex justify-content-between align-items-center p-1 bg-light border rounded shadow-sm"

       <a href="./Profile.html" class="btn btn-link btn-lg"><p id="username" class="mb-0 fw-semibold text-primary"></p>

      <!-- Bootstrap JS -->
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

      <script>
        const token = sessionStorage.getItem("token");
        const username = sessionStorage.getItem("username");
        const role = sessionStorage.getItem("role");

        if (!token) {
          window.location.href = "../../Login.html";
        }

        document.getElementById("username").innerHTML = `Xin chào, ${username}`;
      </script>
    </main>
  </body>
