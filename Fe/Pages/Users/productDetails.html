<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <!-- Bootstrap -->
    <link

    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"

    />

    <style>
      .carousel-item img {
        height: 400px;
        object-fit: contain;
        background-color: #f8f9fa;
      }

      .info-label {
        font-weight: 600;
        color: #6c757d;
      }
    </style>
  </head>
  <body>

      <!-- Header -->

            <!-- Nút toggle trên mobile -->
            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#mainNav"
            >
              <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu -->
            <div class="collapse navbar-collapse" id="mainNav">
                 <!-- Logo -->
                  <a class="navbar-brand fw-bold me-4" href="../../Index.html">
                    <i class="fa-solid fa-store"></i> Team2-Shop
                  </a>
              <ul class="navbar-nav ms-auto mb-2 mb-lg-0 text-white">

                <li class="nav-item">
                  <a class="nav-link" href="#">
                    <i class="fa-solid fa-tags"></i> Sản phẩm
                  </a>
                </li>

                <li class="nav-item">
                  <a class="nav-link" href="#">
                    <!-- <i class="fa-solid fa-cart-shopping"></i> Giỏ hàng -->
                  </a>
                </li>

                <li class="nav-item">
                 <a class="nav-link" href="../../Login.html" id="login">
                    <i class="fa-solid fa-user"></i> Tài khoản
                  </a>
                </li>
              </ul>
            </div>
          </nav>
        </div>
      </header>
      <div class="container-fluid">
        <div class="row">
          <!-- Sidebar trái -->
          <div class="col-md-3 col-lg-2 bg-light border-end min-vh-100 p-3">
            <div class="mb-4">
              <h5 class="text-start mb-3 fw-bold">Danh mục</h5>
              <ul class="nav flex-column gap-1" id="category-menu">
                <!-- TODO: cần tạo search với categories -->
                <li class="nav-item mb-2">
                  <a href="#Electronics" class="nav-link text-dark text-start"
                    >Điện tử</a
                  >
                </li>
                <li class="nav-item mb-2">
                  <a href="#Fashion" class="nav-link text-dark text-start"
                    >Thời trang</a
                  >
                </li>
                <li class="nav-item mb-2">
                  <a href="#Vegetables" class="nav-link text-dark text-start"
                    >Rau củ</a
                  >
                </li>
                <li class="nav-item mb-2">
                  <a href="#Fruits" class="nav-link text-dark text-start"
                    >Trái cây</a
                  >
                </li>
                <li class="nav-item mb-2">
                  <a href="#Meat" class="nav-link text-dark text-start">Thịt</a>
                </li>
                <li class="nav-item mb-2">
                  <a href="#Fish" class="nav-link text-dark text-start">Cá</a>
                </li>
                <li class="nav-item mb-2">
                  <a href="#Home" class="nav-link text-dark text-start"
                    >Gia dụng</a
                  >
                </li>
              </ul>
            </div>

            <div class="mb-4">
              <h5 class="text-start mb-3 fw-bold">Suppliers</h5>
              <ul class="nav flex-column gap-1" id="suppliers_menu"></ul>
            </div>
          </div>

          <!-- ===== CONTENT ===== -->
          <div class="col-md-9 col-lg-10 p-4">
            <div class="d-flex justify-content-end mb-3">
              <p
                class="fw-semibold text-secondary mb-0"
                id="usernameDisplay"
              ></p>
            </div>

            <h2 class="fw-bold mb-4" id="detailsProd">Chi tiết sản phẩm</h2>

            <div class="card shadow-sm p-4">
              <div class="row">
                <!-- IMAGE CAROUSEL -->
                <div class="col-md-6">
                  <div
                    id="productCarousel"
                    class="carousel slide"
                    data-bs-ride="carousel"
                  >
                    <div class="carousel-inner" id="carouselInner">
                      <!-- ảnh sẽ render ở đây -->
                    </div>

                    <button
                      class="carousel-control-prev"
                      type="button"
                      data-bs-target="#productCarousel"
                      data-bs-slide="prev"
                    >
                      <span class="carousel-control-prev-icon"></span>
                    </button>

                    <button
                      class="carousel-control-next"
                      type="button"
                      data-bs-target="#productCarousel"
                      data-bs-slide="next"
                    >
                      <span class="carousel-control-next-icon"></span>
                    </button>
                  </div>
                </div>

                <!-- PRODUCT INFO -->
                <div class="col-md-6">
                  <h3 id="name" class="fw-bold mb-3"></h3>

                  <p>
                    <span class="info-label">Danh mục:</span>
                    <span id="category"></span>
                  </p>

                  <p>
                    <span class="info-label">Giá:</span>
                    <span id="price" class="text-danger fw-semibold"></span>
                  </p>

                  <p>
                    <span class="info-label">Số lượng:</span>
                    <span id="quantity"></span>
                  </p>

                  <p>
                    <span class="info-label">Trạng thái:</span>
                    <span id="status"></span>
                  </p>

                  <hr />

                  <p>
                    <span class="info-label">Mô tả:</span>
                  </p>
                  <p id="description"></p>

                  <a
                    href="../../Index.html"
                    class="btn btn-outline-secondary"
                  >
                    <i class="fa fa-arrow-left me-1"></i> Quay lại
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const token = sessionStorage.getItem("token");
      const username = sessionStorage.getItem("username");
      const role = sessionStorage.getItem("role");
      if (token) {
        login.setAttribute("href","./Profile.html")
      } 


      // show list suppliers
      fetch("http://localhost:8080/api/public/suppliers")
      .then(data=>data.json())
      .then(resp=>{
        if(resp.status=200){
        resp.data.forEach(supplier => {
          const li= document.createElement("li");
          li.setAttribute("class","nav-item mb-2")
          const a= document.createElement("a");
          a.setAttribute("class","nav-link text-dark text-start")
          a.setAttribute("href",`#Pageof${supplier.name}`)
          a.innerText=supplier.name
          li.appendChild(a);
          suppliers_menu.appendChild(li);
        });
        }
      })
      // 
       const API_BASE = "http://localhost:8080/api/user/products/allusers";

    document.addEventListener("DOMContentLoaded", () => {
        const productId =
            new URLSearchParams(window.location.search).get("id");
        if (!productId) {
            alert("Không tìm thấy sản phẩm");
            return;
        }
        loadProductDetail(productId);
    });

    async function loadProductDetail(id) {
        const response = await fetch(`${API_BASE}/${id}`, {
            headers: {
                Authorization: "Bearer " + token
            }
        });
        const res = await response.json();
        renderProduct(res.data);
    }

    function renderProduct(p) {
        document.getElementById("name").innerText = p.name ?? "N/A";
        document.getElementById("category").innerText = p.category ?? "N/A";
        document.getElementById("price").innerText = p.price ? p.price.toLocaleString("vi-VN") + " VND" : "0 VND";
        document.getElementById("quantity").innerText = p.quantity ?? 0;
        document.getElementById("status").innerHTML =
            `<span class="badge bg-${p.status === 'ACTIVE' ? 'success' : 'danger'}">
                ${p.status ?? "UNKNOWN"}
            </span>`;
        document.getElementById("description").innerText = p.description ?? "Không có mô tả";

        renderCarousel(p.imageUrls);
    }

    function renderCarousel(images) {
        const carouselInner =
            document.getElementById("carouselInner");
        if (!images || images.length === 0) {
            carouselInner.innerHTML = `
                <div class="carousel-item active">
                    <img src="https://via.placeholder.com/600x400"
                         class="d-block w-100">
                </div>`;
            return;
        }
        carouselInner.innerHTML = images.map((img, index) => `
            <div class="carousel-item ${index === 0 ? "active" : ""}">
                <img src="${img}" class="d-block w-100">
            </div>
        `).join("");
    }
    </script>
  </body>
</html>
