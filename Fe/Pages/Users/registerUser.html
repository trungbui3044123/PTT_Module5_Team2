<!DOCTYPE html>
<head>
    <!-- <link rel="stylesheet" href="/static/css/register.css"> -->
    <meta charset="UTF-8">
    <title>Register User</title>
     <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
</head>

<body>
    <main>
        <!-- Back button -->
    <div class="mb-3">
        <a id="login" class="btn btn-link fs-4"> Login Pages</a>
    </div>
<div class="container mt-5" style="max-width: 600px;">
    <form id="registerForm" class="card p-4 shadow-sm">
    <h1 class="text-center mb-4">Register User</h1>
  

        <!-- Username -->
        <div class="mb-3">
            <label for="username" class="form-label">Username *</label>
            <input type="text" id="username" name="username" maxlength="100" required class="form-control">
        </div>

        <!-- Password -->
        <div class="mb-3">
            <label for="password" class="form-label">Password *</label>
            <input type="password" id="password" name="password" maxlength="255" required class="form-control">
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label for="email" class="form-label">Email *</label>
            <input type="email" id="email" name="email" maxlength="150" required class="form-control">
        </div>

        <!-- Name -->
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" id="name" name="name" maxlength="150" class="form-control">
        </div>

        <!-- Age -->
        <div class="mb-3">
            <label for="age" class="form-label">Age</label>
            <input type="number" id="age" name="age" min="0" class="form-control">
        </div>

        <!-- Phone -->
        <div class="mb-3">
            <label for="phone" class="form-label">Phone *</label>
            <input type="text" id="phone" name="phone" maxlength="20" required class="form-control">
        </div>

        <!-- Address -->
        <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <input type="text" id="address" name="address" maxlength="255" class="form-control">
        </div>

        <!-- Role -->
        <div class="mb-3">
            <label for="role" class="form-label">Role *</label>
            <select id="role" name="role" required class="form-select">
                <option value="" disabled selected>-- Select role --</option>
                <option value="CUSTOMER">CUSTOMER</option>
                <option value="SUPPLIER">SUPPLIER</option>
            </select>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary w-100">Register</button>

        <!-- Error -->
        <h4 id="error" class="text-danger text-center mt-3 d-none">Register fails</h4>

    </form>
</div>

        <!-- Toast -->
        <div class="toast-container position-fixed top-0 end-0 p-3">
            <div id="liveToast" class="toast align-items-center text-white border-0" role="alert">
                <div class="d-flex">
                    <div class="toast-body" id="toastMessage">
                        <!-- message -->
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto"
                            data-bs-dismiss="toast"></button>
                </div>
            </div>
        </div>
</main>
 <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function showToast(message, isSuccess = true) {
        const toastEl = document.getElementById("liveToast");
        const toastMsg = document.getElementById("toastMessage");

        toastMsg.innerText = message;

        // đổi màu
        toastEl.classList.remove("bg-success", "bg-danger");
        toastEl.classList.add(isSuccess ? "bg-success" : "bg-danger");

        const toast = new bootstrap.Toast(toastEl);
        toast.show();
    }
document.getElementById("registerForm").addEventListener("submit", async function(e) { 
    e.preventDefault(); 
    const data = { 
        username: document.getElementById("username").value, 
        password: document.getElementById("password").value, 
        email: document.getElementById("email").value, 
        name: document.getElementById("name").value, 
        age: document.getElementById("age").value, 
        phone: document.getElementById("phone").value, 
        address: document.getElementById("address").value, 
        role: document.getElementById("role").value
     }; 
try { const res = await fetch("http://localhost:8080/api/public/register", { 
    method: "POST", 
    headers: { "Content-Type": "application/json" }, 
    body: JSON.stringify(data) }); 
    
    let result; 
    try { 
        result = await res.json(); 

    } catch (jsonErr) { 
        console.error("Không parse được JSON:", jsonErr); 
        console.log("Response text:", await res.text()); 
        return; 
    } 
    console.log("RESULT:", result);
    if (res.ok) {
        showToast(result.message || "Đăng ký thành công", true);

        setTimeout(() => {
            window.location.href = "../../Login.html";
        }, 1500);

    } else {
        showToast(result.message || "Đăng ký thất bại", false);
    }
    } catch (err) { console.error("FETCH ERROR:", err); }
}); 
    
// backhome page
      document
        .getElementById("login")
        .addEventListener("click", function (e) {
          e.preventDefault();
          window.location.href = "../../Login.html";
        });    
    </script>
</body>
</html>
