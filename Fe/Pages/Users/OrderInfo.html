    <h3 class="mb-3">Danh sách đơn hàng</h3>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Trạng thái</th>
                <th>Nhà cung cấp</th>
                <th>Người nhận</th>
                <th>SĐT</th>
                <th>Địa chỉ</th>
                <th>Tổng tiền</th>
                <th>Ngày tạo</th>
                <th> </th>
            </tr>
        </thead>
        <tbody id="orderTableBody">
            <!-- JS sẽ render vào đây -->

    </main>

     <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // DOM
      const suppliers_menu = document.getElementById("suppliers_menu");
      const login = document.getElementById("login");
      const profile = document.getElementById("profile");
      const textUserName = document.getElementById("textUserName");
      const textLogin = document.getElementById("textLogin");
      const leftTopUl = document.getElementById("leftTopUl");
      // validate
      const token = sessionStorage.getItem("token");
      const username = sessionStorage.getItem("username");
      const role = sessionStorage.getItem("role");
      const userId = sessionStorage.getItem("id");

      sessionStorage.removeItem("orderInfo");
      if (!token) {
        if(confirm("Need to login to use ")){
          window.location.href = "../../Login.html";

        }else{window.location.href = "../../Index.html";}
          
      }
      else if ((token && role === "CUSTOMER") || (token && role === "USER")) {
        textLogin.innerText = "Log out";
        textUserName.innerText = "Xin chào " + username;
        profile.setAttribute("href", "./Pages/Users/Profile.html");
      }else{
        alert("No authorize")
        window.location.href = "../../Index.html";
      }
      fetch(`http://localhost:8080/api/public/order/customer/${userId}`, {
        method: "GET",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token,
        },
      })
      .then(data=> data.json())
      .then(resp=>{
        console.log(resp);
        if(resp.status===200){
          renderTable(resp.data.content);
          sessionStorage.setItem("orderInfo",JSON.stringify(resp.data.content))
        }
      })
      // Render bảng
function renderTable(orders) {
    const tbody = document.getElementById("orderTableBody");
    tbody.innerHTML = orders.map(order => `
        <tr>
            <td>${order.id}</td>
            <td>${order.status}</td>
            <td>${order.supplierName}</td>
            <td>${order.receiverName}</td>
            <td>${order.receiverPhone}</td>
            <td>${order.receiverAddress}</td>
            <td>${order.totalAmount.toLocaleString()} đ</td>
            <td>${new Date(order.createdAt).toLocaleString()}</td>
             <td>
                <button 
                    class="btn btn-primary btn-sm"
                    onclick="goToDetails(${order.id})"
                >
                    Xem chi tiết
                </button>
            </td>
        </tr>
    `).join("");
}
function goToDetails(orderId) {
    window.location.href = `./OrderDetails.html?orderId=${orderId}`;
}
