<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>All - Lists products</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
   
  </head>
  <body>
    <main>
     <div class="container py-4">

    <!-- Username top-right -->
    <div class="d-flex justify-content-end mb-3">
        <p class="fw-semibold text-secondary mb-0" id="username"></p>
    </div>

    <!-- Back button -->
    <div class="mb-3">
        <button id="homePage" class="btn btn-secondary">Back Home Page</button>
    </div>

    <!-- Search + Create Staff -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <!-- Search Form -->
        <form onsubmit="searchUsers(event)" class="d-flex gap-2">
            <input 
                type="text" 
                name="name" 
                placeholder="Search name" 
                id="searchName" 
                class="form-control"
            />
            <input 
                type="submit" 
                value="Search Users" 
                class="btn btn-primary"
            />
        </form>

        <!-- Create Staff -->
        <button class="btn btn-success" id="createStaff">Create New Staff</button>
    </div>

    <!-- Content -->
    <div class="card shadow-sm p-4">

        <h2 class="title mb-4">Danh sách người dùng</h2>

        <div class="table-responsive">
            <table class="table table-bordered table-striped align-middle" id="userTable">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Salary</th>
                    </tr>
                </thead>
                <tbody id="userBody">
                    <!-- JS render here -->
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div id="pagination" class="mt-3 d-flex justify-content-center"></div>

    </div>

</div>


    </main>
<!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // check admin role only
      const token = sessionStorage.getItem("token");
    const username = sessionStorage.getItem("username");
    const role = sessionStorage.getItem("role");

    document.getElementById("username").innerHTML=`Xin chào, ${username}`;
    //

      const API_URL = "http://localhost:8080/api/admin/users";
      let currentPage = 0;
      let pageSize = 10;

      //
      function loadUsers(page = 0) {
        // const keyword = document.getElementById("searchInput")?.value || "";
        const url = `${API_URL}?page=${page}&size=${pageSize}`;

        fetch(url,{
        method: "GET",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token,
        },
      })
          .then((res) => res.json())
          .then((res) => {
            console.log(res.data.content)
            renderUsers(res.data.content);
            renderPagination(res.data);
            currentPage = res.data.number;
          })
          .catch((err) => console.error("Lỗi khi gọi API:", err));
      }
      //
      function renderUsers(users) {
        const tbody = document.getElementById("userBody");
        tbody.innerHTML = "";
        if (!users || users.length === 0) {
          tbody.innerHTML = `<tr><td colspan="9" class="text-center">Không có dữ liệu</td></tr>`;
          return;
        }
        users.forEach((u) => {
          tbody.innerHTML += ` <tr onclick="window.location.href='./userDetails.html?id=${u.id}'" style="cursor:pointer;"> 
            <td class="text-center">${u.id}</td> <td>${u.username}</td> <td>${u.email}</td> <td>${u.phone}</td> <td>${u.name}</td>
             <td class="text-end">${u.age!== null ? u.age : "-"}</td>  <td>${u.role}</td> <td>${u.status}</td>
              <td class="text-end">${u.salary !== null ? u.salary : "-"}</td> 
            </tr> `;
        });
      }
      //
      function renderPagination(pageData) {
        const container = document.getElementById("pagination");
        container.innerHTML = "";
        const { totalPages, number } = pageData;
        if (totalPages <= 1) return; // Nút Prev
        const prevBtn = document.createElement("button");
        prevBtn.innerText = "Prev";
        prevBtn.className = "btn btn-secondary me-2";
        prevBtn.disabled = number === 0;
        prevBtn.onclick = () => loadUsers(number - 1);
        container.appendChild(prevBtn); // Các nút số trang
        for (let i = 0; i < totalPages; i++) {
          const btn = document.createElement("button");
          btn.innerText = i + 1;
          btn.className = i === number ?  "btn btn-primary me-2" : "btn btn-outline-primary me-2";
          btn.onclick = () => loadUsers(i);
          container.appendChild(btn);
        } 
        
        // Nút Next
        const nextBtn = document.createElement("button");
        nextBtn.innerText = "Next";
        nextBtn.className = "btn btn-secondary";
        nextBtn.disabled = number === totalPages - 1;
        nextBtn.onclick = () => loadUsers(number + 1);
        container.appendChild(nextBtn);
      } 
      
      // Gọi lần đầu
      loadUsers();
      
      function searchUsers(e){
        e.preventDefault();
         const keyword  = document.getElementById("searchName")?.value || "";
        const url = `${API_URL}?keyword=${keyword}`;
        fetch(url,{
        method: "GET",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token,
        },
      })
          .then((res) => res.json())
          .then((res) => {
            console.log(res.data.content)
            renderUsers(res.data.content);
            renderPagination(res.data);
            currentPage = res.data.number;
          })
          .catch((err) => console.error("Lỗi khi gọi API:", err));
      }
      
      // backhome page
      document
        .getElementById("homePage")
        .addEventListener("click", function (e) {
          e.preventDefault();
          window.location.href = "./index.html";
        });
      // Create new staff
      document
        .getElementById("createStaff")
        .addEventListener("click", function (e) {
          e.preventDefault();
          window.location.href = "./registerStaff.html";
        });

    </script>
  </body>
</html>
