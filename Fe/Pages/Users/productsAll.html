<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

  </head>
  <body>
    <main>
      <header class="border-bottom shadow-sm">
        <div class="bg-dark bg-gradient">
          <nav class="navbar navbar-expand-lg navbar-dark py-3">
            <!-- Nút toggle trên mobile -->

              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#mainNav"
            >
              <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu -->
            <div class="collapse navbar-collapse" id="mainNav">
              <!-- Logo -->
              <a class="navbar-brand fw-bold me-4" href="../../Index.html">
                <i class="fa-solid fa-store"></i> Team2-Shop
              </a>
              <ul
                class="navbar-nav ms-auto mb-2 mb-lg-0 text-white"
                id="leftTopUl"
              >
                <li class="nav-item">
                  <a
                    class="nav-link"
                    href="./registerUser.html"
                    id="profile"
                  >
                    <i class="fa-solid fa-user"></i>
                    <span id="textUserName">Tạo tài khoản</span>

                </li>
                <li class="nav-item">
                  <a class="nav-link" id="login" href="../../Login.html">
                    <i class="fa-solid fa-sign-out-alt"></i>
                    <span id="textLogin">Log in</span>
                  </a>

              </ul>
            </div>
          </nav>
        </div>
        <div class="p-2 bg-light">
          <nav class="navbar navbar-expand-lg navbar-light bg-white p-3 w-100">
           
            <!-- Search Form -->
            <form
              id="searchForm"
              class="d-flex flex-column flex-md-row align-items-start gap-2 mx-3"
              onsubmit="searchProducts(event)"
            >
              <!-- Từ khóa -->
              <div class="input-group">
                <input
                  type="text"
                  class="form-control"
                  placeholder="Tìm sản phẩm..."
                  id="searchInput"
                />
              </div>
              <!-- Giá đến -->
              <input
                type="number"
                class="form-control"
                placeholder="Tìm theo giá..."
                id="searchPrice"
                min="0"
              />

              <!-- Nút tìm kiếm -->
              <button type="submit" class="btn btn-primary">
                <i class="fa fa-search"></i>
              </button>
            </form>

            <!-- Icon bên phải -->
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
              <li class="nav-item ms-3">
                <a class="nav-link" href="./Cart.html">
                  <i class="fa-solid fa-cart-shopping"></i> Giỏ hàng
                </a>
              </li>
            </ul>
          </nav>
                     <!-- Tìm theo -->
<div class="d-flex align-items-center gap-4 ms-4 m-2">
  <label class="form-label mb-0">Sắp xếp theo:</label>

  <!-- Dropdown chọn sắp xếp theo giá -->
  <select class="form-select form-select-sm w-auto" id="sortSelect" form="searchForm">
    <option value="">-- Sắp xếp theo giá --</option>
    <option value="PriceUp">Giá cao nhất</option>
    <option value="PriceDown">Giá thấp nhất</option>
  </select>
</div>

        </div>
      </header>
      <section class="container-fluid">
            <article>
              <div class="container my-4">
                <div class="mb-4"><h3 class="fw-bold" id="categoryTitle"></h3></div>
                <div id="product_list" class="row g-3">
                  <div id="noData" style="display: none;">No data</div>
                  <!-- Product Card -->
                </div>
                <!-- Pagination -->
                <div
                  id="pagination"
                  class="mt-4 d-flex justify-content-center"
                ></div>
              </div>
            </article>

      </section>
    </main>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Logged in ?
      const token = sessionStorage.getItem("token");
      const username = sessionStorage.getItem("username");
      const role = sessionStorage.getItem("role");
      // DOM
      const textUserName = document.getElementById("textUserName");
      const textLogin = document.getElementById("textLogin");
      const leftTopUl = document.getElementById("leftTopUl");
      // show UI with logged in/ not logged in users
      if(token){
        textLogin.innerText="Log out";
        textUserName.innerText="Xin chào "+username;
        profile.setAttribute("href","../Users/Profile.html")
        if("SUPPLIER"===role){
          const li = document.createElement("li"); 
          li.className = "nav-item"; 
          li.innerHTML = ` <a class="nav-link" href="../Suppliers/index.html" id="profile"> <i class="fa-solid fa-user"></i> <span id="supplierPage">Dành cho nhà cung cấp</span> </a> `; leftTopUl.prepend(li);
        }
      }
      // get search category
      const params = new URLSearchParams(window.location.search);
      const category = params.get("category");
      const categoryTitle = document.getElementById("categoryTitle");
      const noData = document.getElementById("noData");

     // show list products
      const API_URL =`http://localhost:8080/api/user/products/allusers/categories?category=${category}`;
      const productList = document.getElementById("product_list");
      const pagination = document.getElementById("pagination");

      let currentPage = 0;
      const pageSize = 10;

// Gọi API và hiển thị sản phẩm

      async function fetchProducts(page = 0, keyword = "") {
        try {
          const url = new URL(API_URL);
          url.searchParams.append("page", page);
          url.searchParams.append("size", pageSize);
          if (keyword) {
            url.searchParams.append("keyword", keyword);
          }
          const response = await fetch(url);
          const result = await response.json();

          if (result.status === 200&& result.data.content.length > 0) {
            const products = result.data.content;
            const totalPages = result.data.totalPages;
            currentPage = result.data.number;
            renderProducts(products);
            renderPagination(totalPages, currentPage);
          } else {
            productList.innerHTML = `<p>Không có sản phẩm.</p>`;
          }
        } catch (error) {
          console.error("Lỗi khi fetch sản phẩm:", error);
          productList.innerHTML = `<p>Đã xảy ra lỗi khi tải sản phẩm.</p>`;
        }
      }

      // Hiển thị danh sách sản phẩm
      function renderProducts(products) {
        productList.innerHTML = ""; // Xóa sản phẩm cũ

        products.forEach((product) => {
          const imageUrl = Array.isArray(product.imageUrls)
            ? product.imageUrls[0]
            : product.imageUrls;

          productList.innerHTML += `
        <div class="col-6 col-md-4 col-lg-3">
          <div class="product-card position-relative p-3 border rounded shadow-sm w-100" 
            style="max-width: 220px; min-height: 250px;" id="product_card">

            <a class="pcbanner d-block text-decoration-none" href="./productDetails.html?id=${product.id}"> 
              <div class="prodName mb-2 text-truncate"> 
                <h4>${product.name}</h4>
              </div> 
              <div class="proMeta mb-2 d-flex justify-content-between gap-2">
                <div class="category bg-danger text-white p-1 rounded text-center flex-fill">
                  <span class="fst-italic" style="font-size: 15px;">${product.category}</span>                                
                </div> 
                <div class="supplier border border-light text-primary p-1 rounded text-center flex-fill">
                  <span class="fst-italic" style="font-size: 15px;">${product.supplierName}</span> 
                </div> 
              </div> 
              <div class="prodImg"> 
                <img src="${imageUrl}" alt="${product.name}" class="img-fluid rounded"> 
              </div> 
              <div class="prodDetails mt-3 text-dark fw-bold text-truncate" style="width: 100px;">
                ${product.description}
              </div>
              <div class="prodPrice text-danger fw-bold mt-2 fs-5 text-truncate">  
                ${product.price.toLocaleString()} VND〜 
              </div> 
            </a> 
          </div> 
        </div>
      `;
        });
      }

      // Tạo phân trang
      function renderPagination(totalPages, currentPage) {
        pagination.innerHTML = "";

        for (let i = 0; i < totalPages; i++) {
          const pageBtn = document.createElement("button");
          pageBtn.className = `btn btn-sm mx-1 ${i === currentPage ? "btn-primary" : "btn-outline-primary"}`;
          pageBtn.textContent = i + 1;
          pageBtn.addEventListener("click", () => fetchProducts(i, currentKeyword)); pagination.appendChild(pageBtn);
        }
      }

      // Gọi lần đầu khi trang được tải
      fetchProducts();
      //  search

    async  function searchProducts(event,page = 0) {
        event.preventDefault(); // Ngăn form reload trang nếu có 
        const input = document.getElementById("searchInput"); 
        const price = document.getElementById("searchPrice").value; 
        const sortValue  = document.getElementById("sortSelect").value;
        console.log(category)

        // Chuyển đổi sort 
        let sortDir = "asc"; 
        if (sortValue === "PriceUp") sortDir = "desc"; // Giá cao nhất
        if (sortValue === "PriceDown") sortDir = "asc"; // Giá thấp nhất


        const url = new URL("http://localhost:8080/api/user/products/allusers/searchs");
          url.searchParams.append("page", page);
          url.searchParams.append("size", pageSize);
          url.searchParams.append("sortDir", sortDir);
          url.searchParams.append("category", category);
          if (price) {
           url.searchParams.append("price", price);
          }
         try {
          

          const response = await fetch(url);
          const result = await response.json();

          if (result.status === 200&& result.data.content.length > 0) {
            const products = result.data.content;
            const totalPages = result.data.totalPages;
            currentPage = result.data.number;
            renderProducts(products);
            renderPagination(totalPages, currentPage);
          } else {
            productList.innerHTML = `<p>Không có sản phẩm.</p>`;
          }
        } catch (error) {
          console.error("Lỗi khi fetch sản phẩm:", error);
          productList.innerHTML = `<p>Đã xảy ra lỗi khi tải sản phẩm.</p>`;
        }

      }      
    


// end
    </script>
  </body>
</html>
