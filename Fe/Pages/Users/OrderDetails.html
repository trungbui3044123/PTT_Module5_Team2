  // Render cart items
 function renderCart(order) {
    const cartContainer = document.getElementById("cart");
    cartContainer.innerHTML = "";

    if (!order.items || order.items.length === 0) {
        cartContainer.innerHTML = `<h3>Không có sản phẩm trong đơn hàng</h3>`;
        return;
    }

     let originalTotal = 0;
     let totalQuantity = 0;

    order.items.forEach(item => {
        originalTotal += item.subtotal;
        totalQuantity += item.quantity;

        const card = `
            <div class="col-12 mb-3">
    <div class="card shadow-sm p-3">
        <div class="row align-items-center">

            <!-- Text sản phẩm -->
            <div class="col-md-9">
                <p><strong>Tên sản phẩm:</strong> ${item.productName}</p>
                <p><strong>Giá:</strong> ${item.unitPrice.toLocaleString()} VND</p>
                <p><strong>Số lượng:</strong> ${item.quantity}</p>
                <p><strong>Tạm tính:</strong> ${item.subtotal.toLocaleString()} VND</p>
                <button
                    class="btn btn-primary btn-sm mt-2"
                    onclick="goToProduct(${item.productId})"
                >
                    Xem sản phẩm
                </button>
            </div>

            <!-- Ảnh sản phẩm -->
            <div class="col-md-3 text-center">
                <img src="${item.productImageUrl || 'https://via.placeholder.com/100'}"
                     alt="${item.productName}"
                     class="img-fluid rounded"
                     style="max-width: 100px; max-height: 100px; object-fit: cover;">
            </div>

        </div>
    </div>
</div>
        `;

        cartContainer.innerHTML += card;
    });

     let discount = 0;

     if (order.coupon) {
         discount = originalTotal - order.totalAmount;

         document.getElementById("couponInfo").innerText =
             order.coupon.code + " (-" + order.coupon.value + "%)";
     } else {
         document.getElementById("couponInfo").innerText =
             "Không sử dụng mã khuyến mãi";
     }

    // Summary
     document.getElementById("originalAmount").textContent =
         originalTotal.toLocaleString() + " VND";

     document.getElementById("discountAmount").textContent =
         "- " + discount.toLocaleString() + " VND";

     document.getElementById("totalAmount").textContent =
         order.totalAmount.toLocaleString() + " VND";

     document.getElementById("totalProducts").textContent =
         order.items.length;

     document.getElementById("totalQuantity").textContent =
         totalQuantity;

     document.getElementById("cusName").textContent = order.receiverName;
     document.getElementById("cusPhone").textContent = order.receiverPhone;
     document.getElementById("shipAddress").textContent =
         order.receiverAddress || "";
}

    const params = new URLSearchParams(window.location.search);
    const orderId = params.get("orderId");

    fetch(`http://localhost:8080/api/public/order/${orderId}`, {
        headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token,
        }
    })
    .then(res => res.json())
    .then(order => {
        renderCart(order);

        if (order.status === "PENDING") {
            document.getElementById("cancleOrder").style.display = "block";
        }
    });

function goToProduct(productId) {
    window.location.href = `./productDetails.html?id=${productId}`;
}
// huy don hang
function cancelOrder(orderId) {
    if (!confirm("Bạn có chắc muốn hủy đơn hàng này không?")) return;
    fetch(`http://localhost:8080/api/public/order/cancel?orderId=${orderId}`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token,
        }
    })
    .then(res => {
    if (res.status === 204) {
        alert("Hủy đơn hàng thành công");
         window.location.href = `./OrderInfo.html`;
    } else {
        alert("Không thể hủy đơn hàng");
    }
})
.catch(err => console.error(err));
}
