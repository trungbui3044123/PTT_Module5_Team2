<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
</head>
<body>
<main>
    <div class="container-fluid">
        <div class="row">

            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 bg-dark text-white min-vh-100 p-3">
                <h2 class="text-center mb-4">Staff Panel</h2>

                <ul class="nav flex-column">
                    <li class="nav-item mb-2">
                        <a href="#" class="nav-link text-white">Dashboard</a>
                    </li>

                    <li class="nav-item mb-2">
                        <a href="./violation-create.html" class="nav-link text-white">
                            Create Violation
                        </a>
                    </li>

                    <li class="nav-item mb-2">
                        <a href="./violation-list.html" class="nav-link text-white">
                            Violation List
                        </a>
                    </li>

                    <li class="nav-item mb-2">
                        <a href="./send-mail.html" class="nav-link text-white">
                            Send Warning Mail
                        </a>
                    </li>

                    <li class="nav-item mb-2">
                        <a href="./revenue.html" class="nav-link text-white">Revenue</a>
                    </li>

                    <li class="nav-item mt-3">
                        <a href="../../Login.html" class="btn btn-danger w-100">Logout</a>
                    </li>
                </ul>
            </div>

            <!-- Content -->
            <div class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-end mb-2">
                    <p class="fw-semibold text-secondary" id="username"></p>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="fw-bold">Dashboard</h1>
                </div>

                <div class="row">
                    <!-- Example Cards -->
                    <div class="col-md-4">
                        <div class="card revenue-card shadow p-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6>Tổng doanh thu</h6>
                                    <h2 id="totalAdminRevenue">...</h2>
                                </div>
                                <div class="icon-box">💰</div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4 mb-3">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title">Users</h5>
                                <p class="card-text">Tổng số người dùng: 120</p>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4 mb-3">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title">Staff</h5>
                                <p class="card-text">Nhân viên đang hoạt động: 15</p>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4 mb-3">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title">Reports</h5>
                                <p class="card-text">Báo cáo mới: 8</p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>

</main>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const token = sessionStorage.getItem("token");
    const username = sessionStorage.getItem("username");
    const role = sessionStorage.getItem("role");

    if (!token || role !== "STAFF") {
        window.location.href = "../../Login.html";
    }

    document.getElementById("username").innerHTML = `Xin chào, ${username}`;

    async function loadTotalRevenue() {
        try {
            const response = await fetch("http://localhost:8080/api/revenue/admin?page=0&size=100", {
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            const data = await response.json();

            let total = 0;

            if (!data || !data.data || !data.data.content) {
                throw new Error("API lỗi");
            }

            data.data.content.forEach(item => {
                total += Number(item.adminRevenue || 0);
            });

            document.getElementById("totalAdminRevenue").innerText =
                total.toLocaleString("vi-VN") + " VND";

        } catch (error) {
            console.error("Lỗi load doanh thu:", error);
        }
    }

    loadTotalRevenue();


</script>
</body>
</html>
