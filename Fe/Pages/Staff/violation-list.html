<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Violation List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 bg-dark text-white min-vh-100 p-3">
            <h2 class="text-center mb-4">Staff Panel</h2>

            <ul class="nav flex-column">
                <li class="nav-item mb-2">
                    <a href="./index.html" class="nav-link text-white">Dashboard</a>
                </li>

                <li class="nav-item mb-2">
                    <a href="./violation-create.html" class="nav-link text-white">Create Violation</a>
                </li>

                <li class="nav-item mb-2">
                    <a href="./violation-list.html" class="nav-link text-white active">Violation List</a>
                </li>

                <li class="nav-item mb-2">
                    <a href="./send-mail.html" class="nav-link text-white">Send Mail</a>
                </li>

                <li class="nav-item mt-3">
                    <a href="../../Login.html" class="btn btn-danger w-100">Logout</a>
                </li>
            </ul>
        </div>

        <!-- Content -->
        <div class="col-md-9 col-lg-10 p-4">

            <div class="d-flex justify-content-between mb-3">
                <h3>Danh sách Violation</h3>
                <p id="username"></p>
            </div>

            <div class="d-flex mb-3 gap-2">

                <input
                        type="text"
                        id="searchInput"
                        class="form-control"
                        placeholder="Search violation..."
                >

                <button class="btn btn-primary" onclick="searchViolation()">
                    Search
                </button>

            </div>

            <div class="card shadow p-3">

                <table class="table table-bordered text-center">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Customer</th>
                        <th>Supplier</th>
                        <th>Nội dung</th>
                        <th>Status</th>
                        <th>Ngày tạo</th>
                    </tr>
                    </thead>

                    <tbody id="tableBody">
                    <tr><td colspan="6">Loading...</td></tr>
                    </tbody>
                </table>

                <!-- Pagination -->
                <div class="d-flex justify-content-between">
                    <button class="btn btn-secondary" onclick="prevPage()">Prev</button>
                    <span id="pageInfo"></span>
                    <button class="btn btn-secondary" onclick="nextPage()">Next</button>
                </div>

            </div>
        </div>
    </div>
</div>

<script>
    const API = "http://localhost:8080";
    const token = sessionStorage.getItem("token");
    const username = sessionStorage.getItem("username");
    const role = sessionStorage.getItem("role");

    if (!token || role !== "STAFF") {
        window.location.href = "../../Login.html";
    }

    document.getElementById("username").innerText = "Xin chào, " + username;

    let page = 0;
    let size = 5;
    let totalPages = 0;
    let keyword = "";

    async function loadViolations() {
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = `<tr><td colspan="6">Đang tải...</td></tr>`;

        try {

            const res = await fetch(`${API}/api/staff/violations?page=${page}&size=${size}&keyword=${keyword}`, {
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            if (!res.ok) throw new Error("Server error");

            const data = await res.json();

            if (!data.data || !data.data.content) {
                throw new Error("Sai format API");
            }

            const list = data.data.content;
            totalPages = data.data.totalPages;

            tbody.innerHTML = "";

            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6">Không có dữ liệu</td></tr>`;
                return;
            }

            list.forEach(v => {
                tbody.innerHTML += `
                    <tr>
                        <td>${v.id}</td>
                        <td>${v.customerName || "-"}</td>
                        <td>${v.supplierName || "-"}</td>
                        <td>${v.violation}</td>
                        <td>${renderStatus(v.status)}</td>
                        <td>${formatDate(v.createdAt)}</td>
                    </tr>
                `;
            });

            document.getElementById("pageInfo").innerText =
                `Page ${page + 1} / ${totalPages}`;

        } catch (err) {
            console.error(err);
            tbody.innerHTML = `<tr><td colspan="6">Lỗi tải dữ liệu</td></tr>`;
        }
    }

    function renderStatus(status) {
        if (status === "HIGH") {
            return `<span class="badge bg-danger">HIGH</span>`;
        }
        if (status === "MEDIUM") {
            return `<span class="badge bg-warning text-dark">MEDIUM</span>`;
        }
        return `<span class="badge bg-success">LOW</span>`;
    }

    function formatDate(dateStr) {
        if (!dateStr) return "-";
        const d = new Date(dateStr);
        return d.toLocaleString("vi-VN");
    }

    function searchViolation() {
        keyword = document.getElementById("searchInput").value;
        page = 0; // reset về trang đầu
        loadViolations();
    }

    function nextPage() {
        if (page < totalPages - 1) {
            page++;
            loadViolations();
        }
    }

    function prevPage() {
        if (page > 0) {
            page--;
            loadViolations();
        }
    }

    loadViolations();
</script>

</body>
</html>
