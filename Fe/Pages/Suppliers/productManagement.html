<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier - Product Management</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .product-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
        }
        .badge-ACTIVE {
            background-color: #198754;
        }
        .badge-INACTIVE {
            background-color: #dc3545;
        }
    </style>
</head>
<body>

<main>
    <div class="container-fluid">
        <div class="row">

            <!-- ===== SIDEBAR (ĐỒNG BỘ) ===== -->
            <div class="col-md-3 col-lg-2 bg-dark text-white min-vh-100 p-3">
                <h2 class="text-center mb-4">Supplier Panel</h2>

                <ul class="nav flex-column">
                    <li class="nav-item mb-2">
                        <a href="index.html" class="nav-link text-white">
                            Dashboard
                        </a>
                    </li>

<!--                    <li class="nav-item mb-2">-->
<!--                        <a href="add-product.html" class="nav-link text-white">-->
<!--                            Add Product-->
<!--                        </a>-->
<!--                    </li>-->

                    <li class="nav-item mb-2">
                        <a href="productManagement.html" class="nav-link text-white active">
                            Product Management
                        </a>
                    </li>

                    <li class="nav-item mt-3">
                        <a href="../../Login.html" class="btn btn-danger w-100">
                            Logout
                        </a>
                    </li>
                </ul>
            </div>

            <!-- ===== CONTENT ===== -->
            <div class="col-md-9 col-lg-10 p-4">

                <!-- USER -->
                <div class="d-flex justify-content-end mb-3">
                    <p class="fw-semibold text-secondary mb-0" id="usernameDisplay"></p>
                </div>

                <!-- HEADER -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="fw-bold">Danh sách sản phẩm của tôi</h2>
                    <a href="add-product.html" class="btn btn-success">
                        <i class="fa fa-plus me-1"></i> Thêm sản phẩm
                    </a>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <input
                                type="text"
                                id="searchInput"
                                class="form-control"
                                placeholder="Tìm kiếm theo tên sản phẩm..."
                        >
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary w-100" onclick="searchProducts()">
                            <i class="fa fa-search me-1"></i> Tìm kiếm
                        </button>
                    </div>
                </div>


                <!-- TABLE -->
                <div class="card shadow-sm p-4">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-dark">
                            <tr>
                                <th>Ảnh</th>
                                <th>Tên sản phẩm</th>
                                <th>Loại</th>
                                <th>Giá bán</th>
                                <th>Số lượng</th>
                                <th>Trạng thái</th>
                                <th class="text-center">Thao tác</th>
                            </tr>
                            </thead>
                            <tbody id="productBody"></tbody>
                        </table>
                    </div>

                    <!-- PAGINATION -->
                    <div id="pagination" class="mt-3 d-flex justify-content-center"></div>
                </div>

            </div>
        </div>
    </div>
</main>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let currentPage = 0;
    let currentKeyword = "";
    const token = sessionStorage.getItem("token");
    const username = sessionStorage.getItem("username");
    const role = sessionStorage.getItem("role");

    if (!token || role !== "SUPPLIER") {
        window.location.href = "../../Login.html";
    }

    document.getElementById("usernameDisplay").innerText = `Xin chào, ${username}`;

    const API_URL = "http://localhost:8080/api/user/products/my-products";

    async function loadProducts(page = 0, keyword = "") {
        try {
            currentPage = page;
            currentKeyword = keyword;

            const response = await fetch(
                `${API_URL}?page=${page}&size=10&keyword=${keyword}`,
                {
                    headers: {
                        Authorization: "Bearer " + token
                    }
                }
            );

            const res = await response.json();

            renderProducts(res.data.content);
            renderPagination(res.data);

        } catch (err) {
            console.error("Lỗi load sản phẩm:", err);
        }
    }

    function searchProducts() {
        const keyword = document.getElementById("searchInput").value.trim();
        loadProducts(0, keyword);
    }

    function renderProducts(products) {
        const tbody = document.getElementById("productBody");
        tbody.innerHTML = products.map(p => `
        <tr>
            <td>
                <div class="d-flex flex-wrap gap-1">
                    ${(p.imageUrls && p.imageUrls.length > 0)
            ? p.imageUrls.map(img => `
                            <img src="${img}"
                                 class="product-img border shadow-sm">
                          `).join("")
            : `<img src="https://via.placeholder.com/60"
                               class="product-img border shadow-sm">`
        }
                </div>
            </td>

            <td class="fw-bold">${p.name}</td>

            <td>
                <span class="badge bg-info text-dark">
                    ${p.category || "N/A"}
                </span>
            </td>

            <td class="text-danger fw-semibold">
                ${p.price.toLocaleString()} VND
            </td>

            <td class="text-danger fw-semibold">
                ${p.quantity.toLocaleString('de-DE')}
            </td>

            <td>
                <span class="badge badge-${p.status}">
                    ${p.status}
                </span>
            </td>

            <td class="text-center">
                <button class="btn btn-sm btn-outline-primary me-1" onclick="window.location.href='edit-product.html?id=${p.id}'">
                    <i class="fa fa-edit"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger">
                    <i class="fa fa-trash"></i>
                </button>
            </td>
        </tr>
    `).join("");
    }

    function renderPagination(pageData) {
        const container = document.getElementById("pagination");
        container.innerHTML = "";

        for (let i = 0; i < pageData.totalPages; i++) {
            const btn = document.createElement("button");
            btn.innerText = i + 1;
            btn.className = `btn btn-sm me-1 ${
                i === pageData.number ? "btn-primary" : "btn-outline-primary"
            }`;
            btn.onclick = () => loadProducts(i, currentKeyword);
            container.appendChild(btn);
        }
    }


    loadProducts();
</script>

</body>
</html>
