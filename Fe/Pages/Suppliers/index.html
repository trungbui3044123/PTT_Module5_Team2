<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<main>
    <div class="container-fluid">
        <div class="row">

            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 bg-dark text-white min-vh-100 p-3">
                <h2 class="text-center mb-4">Supplier Panel</h2>

                <ul class="nav flex-column">
                    <li class="nav-item mb-2">
                        <a href="index.html" class="nav-link text-white">Dashboard</a>
                    </li>

<!--                    <li class="nav-item mb-2">-->
<!--                        <a href="./add-product.html" class="nav-link text-white">Add Product</a>-->
<!--                    </li>-->

                    <li class="nav-item mb-2">
                        <a href="productManagement.html" class="nav-link text-white active">
                            Product Management
                        </a>
                    </li>

                    <li class="nav-item mb-2">
                        <a href="orderManagement.html"
                           class="nav-link text-white">
                            Order Management
                        </a>
                    </li>


                    <li class="nav-item mt-3">
                        <a href="../../Login.html" class="btn btn-danger w-100">Logout</a>
                    </li>
                </ul>
            </div>

            <!-- Content -->
            <div class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-end align-items-center mb-2 gap-3">

                    <!-- Notification Bell -->
                    <div class="dropdown">
                        <button class="btn position-relative" id="notificationBtn"
                                data-bs-toggle="dropdown">
                            <i class="fa-solid fa-bell fs-5"></i>
                            <span id="notificationBadge"
                                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                                  style="display: none;">
            </span>
                        </button>

                        <ul class="dropdown-menu dropdown-menu-end shadow"
                            style="width: 320px; max-height: 400px; overflow-y: auto;"
                            id="notificationList">
                            <li class="dropdown-header fw-bold">Thông báo</li>
                            <li><hr class="dropdown-divider"></li>
                            <li class="text-center text-muted py-2">Không có thông báo</li>
                        </ul>
                    </div>

                    <p class="fw-semibold text-secondary mb-0" id="username"></p>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="fw-bold">Dashboard</h1>
                </div>

                <div class="row">
                    <!-- Example Cards -->
                    <div class="col-md-4 mb-3">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title">Users</h5>
                                <p class="card-text">Tổng số người dùng: 120</p>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4 mb-3">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title">Staff</h5>
                                <p class="card-text">Nhân viên đang hoạt động: 15</p>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4 mb-3">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title">Reports</h5>
                                <p class="card-text">Báo cáo mới: 8</p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>

</main>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../public/assets/notification.js"></script>

<script>
    const token = sessionStorage.getItem("token");
    const username = sessionStorage.getItem("username");
    const role = sessionStorage.getItem("role");

    if (!token|| role!=="SUPPLIER") {
        window.location.href = "../../Login.html";
    }

    document.getElementById("username").innerHTML=`Xin chào, ${username}`;
</script>
</body>
</html>
