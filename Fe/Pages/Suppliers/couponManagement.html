<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Coupon Management</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Toastr -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"/>

    <style>
        .badge-ACTIVE { background-color: #198754; }
        .badge-INACTIVE { background-color: #dc3545; }
    </style>
</head>

<style>
    .switch {
        position: relative;
        display: inline-block;
        width: 50px;
        height: 26px;
    }
    .switch input { display: none; }

    .slider {
        position: absolute;
        cursor: pointer;
        background-color: #ccc;
        border-radius: 34px;
        top: 0; left: 0; right: 0; bottom: 0;
        transition: .3s;
    }

    .slider:before {
        position: absolute;
        content: "";
        height: 20px;
        width: 20px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        border-radius: 50%;
        transition: .3s;
    }

    input:checked + .slider {
        background-color: #198754;
    }

    input:checked + .slider:before {
        transform: translateX(24px);
    }
</style>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-3 col-lg-2 bg-dark text-white min-vh-100 p-3">
            <h2 class="text-center mb-4">Supplier Panel</h2>

            <ul class="nav flex-column">
                <li class="nav-item mb-2">
                    <a href="index.html" class="nav-link text-white">
                        Dashboard
                    </a>
                </li>

                <li class="nav-item mb-2">
                    <a href="productManagement.html" class="nav-link text-white">Product Management</a>
                </li>
                <li class="nav-item mb-2">
                    <a href="orderManagement.html"
                       class="nav-link text-white">
                        Order Management
                    </a>
                </li>
                <li class="nav-item mb-2">
                    <a href="couponManagement.html" class="nav-link text-white active">Coupon Management</a>
                </li>
                <li class="nav-item mt-3">
                    <a href="../../Login.html" class="btn btn-danger w-100">
                        Logout
                    </a>
                </li>
            </ul>
        </div>

        <!-- CONTENT -->
        <div class="col-md-9 col-lg-10 p-4">

            <div class="d-flex justify-content-end mb-3">
                <!-- Notification Bell -->
                <div class="dropdown">
                    <button class="btn position-relative" id="notificationBtn"
                            data-bs-toggle="dropdown">
                        <i class="fa-solid fa-bell fs-5"></i>
                        <span id="notificationBadge"
                              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                              style="display: none;">
                        </span>
                    </button>

                    <ul class="dropdown-menu dropdown-menu-end shadow"
                        style="width: 320px; max-height: 400px; overflow-y: auto;"
                        id="notificationList">
                        <li class="dropdown-header fw-bold">Thông báo</li>
                        <li><hr class="dropdown-divider"></li>
                        <li class="text-center text-muted py-2">Không có thông báo</li>
                    </ul>
                </div>
                <p class="fw-semibold text-secondary mb-0"
                   id="usernameDisplay"></p>
            </div>

            <div class="d-flex justify-content-between mb-3">
                <h2>Quản lý mã khuyến mãi</h2>
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addModal">
                    <i class="fa fa-plus"></i> Thêm mã
                </button>
            </div>

            <!-- FILTER -->
            <div class="row mb-3">
                <div class="col-md-4">
                    <input id="searchInput" class="form-control" placeholder="Tìm theo code">
                </div>

                <div class="col-md-3">
                    <select id="statusFilter" class="form-select">
                        <option value="">Tất cả</option>
                        <option value="true">Đang hoạt động</option>
                        <option value="false">Ngưng hoạt động</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <button class="btn btn-primary w-100" onclick="searchCoupons()">
                        <i class="fa fa-search"></i> Tìm
                    </button>
                </div>
            </div>

            <!-- TABLE -->
            <div class="card p-3 shadow-sm">
                <table class="table table-hover">
                    <thead class="table-dark">
                    <tr>
                        <th>Code</th>
                        <th>%</th>
                        <th>Min</th>
                        <th>Used</th>
                        <th>Limit</th>
                        <th>Expire</th>
                        <th>Status</th>
                        <th class="text-center">Action</th>
                    </tr>
                    </thead>
                    <tbody id="couponBody"></tbody>
                </table>

                <!-- PAGINATION -->
                <div id="pagination" class="mt-3 d-flex justify-content-center"></div>
            </div>

        </div>
    </div>
</div>

<!-- MODAL -->
<div class="modal fade" id="addModal">
    <div class="modal-dialog">
        <div class="modal-content p-3">
            <h5>Thêm mã</h5>

            <input id="code" class="form-control mb-2" placeholder="Code">
            <input id="value" type="number" class="form-control mb-2" placeholder="%">
            <input id="min" type="number" class="form-control mb-2" placeholder="Min">
            <input id="limit" type="number" class="form-control mb-2" placeholder="Limit">
            <input id="expire" type="datetime-local" class="form-control mb-2">

            <button class="btn btn-primary" onclick="createCoupon()">Lưu</button>
        </div>
    </div>
</div>

<div class="modal fade" id="confirmModal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-3 text-center">

            <h5 class="mb-3">Xác nhận xóa</h5>
            <p>Bạn có chắc muốn xóa mã này?</p>

            <div class="d-flex justify-content-center gap-2">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                <button class="btn btn-danger" id="confirmDeleteBtn">Xóa</button>
            </div>

        </div>
    </div>
</div>

<!-- SCRIPT -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
<script src="../../public/assets/notification.js"></script>

<script>

    const token = sessionStorage.getItem("token");
    const username = sessionStorage.getItem("username");
    const role = sessionStorage.getItem("role");

    if (!token || role !== "SUPPLIER") {
        window.location.href = "../../Login.html";
    }

    $("#usernameDisplay").text("Xin chào, " + username);

    let currentPage = 0;
    let currentKeyword = "";
    let currentStatus = null;

    // 🔥 AJAX SETUP
    $.ajaxSetup({
        headers: {
            Authorization: "Bearer " + token,
            "Content-Type": "application/json"
        }
    });

    // ================= LOAD =================
    function loadCoupons(page = 0, keyword = "", status = null){

        currentPage = page;
        currentKeyword = keyword;
        currentStatus = status;

        $.ajax({
            url: `http://localhost:8080/api/supplier/coupons`,
            method: "GET",
            data: {
                page: page,
                size: 10,
                keyword: keyword,
                status: status
            },
            success: res => {
                renderCoupons(res.data.content);
                renderPagination(res.data);
            },
            error: err => toastr.error(err.responseJSON?.message || "Lỗi server")
        });
    }

    // ================= SEARCH =================
    function searchCoupons(){
        const keyword = $("#searchInput").val().trim();
        let status = $("#statusFilter").val();

        // 🔥 convert string -> boolean
        if(status === "true") status = true;
        else if(status === "false") status = false;
        else status = null;

        loadCoupons(0, keyword, status);
    }

    // ================= FORMAT DATE =================
    function formatDate(dateStr){
        if(!dateStr) return "-";

        const d = new Date(dateStr);
        return d.toLocaleString("vi-VN");
    }

    // ================= RENDER =================
    function renderCoupons(list){

        let html = "";

        if(!list || list.length === 0){
            html = `
        <tr>
            <td colspan="8" class="text-center text-muted py-4">
                Không có mã khuyến mãi nào
            </td>
        </tr>
        `;
        } else {
            list.forEach(c => {
                html += `
            <tr>
                <td>${c.code}</td>
                <td>${c.value}%</td>
                <td>${Number(c.minOrderValue).toLocaleString()} VND</td>
                <td>${c.usedCount}</td>
                <td>${c.usageLimit}</td>
                <td>${formatDate(c.expiresAt)}</td>
                <td>
                    <span class="badge ${c.isActive ? 'badge-ACTIVE':'badge-INACTIVE'}">
                        ${c.isActive ? 'Đang hoạt động':'Ngưng hoạt động'}
                    </span>
                </td>
                <td class="text-center">
                    <label class="switch">
                    <input type="checkbox" ${c.isActive ? 'checked' : ''}
                        onchange="toggleCoupon(${c.id})">
                        <span class="slider"></span>
                    </label>

                    <button class="btn btn-sm btn-danger ms-2"
                        onclick="confirmDelete(${c.id})">
                        <i class="fa fa-trash"></i>
                    </button>
                </td>
            </tr>
            `;
            });
        }

        $("#couponBody").html(html);
    }

    // ================= PAGINATION =================
    function renderPagination(pageData){

        const container = $("#pagination");
        container.html("");

        for(let i=0;i<pageData.totalPages;i++){
            const btn = `
            <button class="btn btn-sm me-1 ${
                i === pageData.number ? "btn-primary":"btn-outline-primary"
            }"
            onclick="loadCoupons(${i}, '${currentKeyword}', ${currentStatus})">
                ${i+1}
            </button>
        `;
            container.append(btn);
        }
    }

    // ================= CREATE =================
    function createCoupon(){

        const data = {
            code: $("#code").val(),
            value: Number($("#value").val()),
            minOrderValue: Number($("#min").val()),
            usageLimit: Number($("#limit").val()),
            expiresAt: $("#expire").val()
        };

        $.ajax({
            url: `http://localhost:8080/api/supplier/coupons`,
            method: "POST",
            data: JSON.stringify(data),
            success: res => {
                toastr.success(res.message);
                bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
                loadCoupons();
            },
            error: err => {
                const errors = err.responseJSON?.data;
                if(errors) {
                    // lấy message field đầu tiên để hiển thị
                    const firstMsg = Object.values(errors)[0];
                    toastr.error(firstMsg);
                } else {
                    toastr.error(err.responseJSON?.message || "Lỗi tạo mã");
                }
            }
        });
    }

    // ================= TOGGLE =================
    function toggleCoupon(id){
        $.ajax({
            url: `http://localhost:8080/api/supplier/coupons/${id}/toggle`,
            method: "PATCH"
        })
            .done(res => {
                toastr.success(res.message);
                loadCoupons(currentPage, currentKeyword, currentStatus);
            })
            .fail(err => toastr.error(err.responseJSON?.message || "Lỗi toggle"));
    }

    // ================= DELETE =================

    let deleteId = null;

    function confirmDelete(id){
        deleteId = id;
        new bootstrap.Modal(document.getElementById('confirmModal')).show();
    }

    document.getElementById("confirmDeleteBtn").addEventListener("click", () => {

        if(!deleteId) return;

        $.ajax({
            url: `http://localhost:8080/api/supplier/coupons/${deleteId}`,
            method: "DELETE"
        })
            .done(res => {
                toastr.success(res.message);
                loadCoupons(currentPage, currentKeyword, currentStatus);
            })
            .fail(err => toastr.error(err.responseJSON?.message || "Không thể xóa"));

        bootstrap.Modal.getInstance(document.getElementById('confirmModal')).hide();
    });

    // function deleteCoupon(id){
    //
    //     if(!confirm("Bạn chắc chắn muốn xóa?")) return;
    //
    //     $.ajax({
    //         url: `/api/supplier/coupons/${id}`,
    //         method: "DELETE"
    //     })
    //         .done(res => {
    //             toastr.success(res.message);
    //             loadCoupons(currentPage, currentKeyword, currentStatus);
    //         })
    //         .fail(err => toastr.error(err.responseJSON?.message || "Không thể xóa"));
    // }

    // INIT
    loadCoupons();

</script>

</body>
</html>
