<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Supplier - Chỉnh sửa sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .error-msg { color: #dc3545; font-size: 0.875em; display: none; margin-top: 0.25rem; }
        .preview-img { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }
        .old-img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; border: 2px solid #0d6efd; }
    </style>
</head>
<body>
<main>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 bg-dark text-white min-vh-100 p-3">
                <h2 class="text-center mb-4">Supplier Panel</h2>
                <ul class="nav flex-column">
                    <li class="nav-item mb-2"><a href="productManagement.html" class="nav-link text-white active">Product Management</a></li>
                    <li class="nav-item mb-2">
                        <a href="orderManagement.html" class="nav-link text-white">
                            Order Management
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a href="couponManagement.html" class="nav-link text-white">Coupon Management</a>
                    </li>
                    <li class="nav-item mb-2">
                        <a href="reviewManagement.html" class="nav-link text-white">
                            Review Management
                        </a>
                    </li>
                    <li class="nav-item mt-3"><a href="../../Login.html" class="btn btn-danger w-100">Logout</a></li>
                </ul>
            </div>

            <div class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-end mb-3">
                    <p class="fw-semibold text-secondary mb-0" id="usernameDisplay"></p>
                </div>

                <div class="card shadow-sm p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="fw-bold">Chỉnh sửa sản phẩm</h2>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="statusToggle" style="width: 50px; height: 25px;">
                            <label class="form-check-label fw-bold ms-2" id="statusLabel">Đang bán</label>
                        </div>
                    </div>

                    <form id="updateForm">
                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label class="form-label fw-bold">Tên sản phẩm</label>
                                <input type="text" name="name" id="name" class="form-control">
                                <div id="err-name" class="error-msg"></div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">Loại sản phẩm</label>
                                <select name="category" id="category" class="form-select">
                                    <option value="">-- Chọn chủng loại --</option>
                                    <option value="Electronics">Điện tử</option>
                                    <option value="Fashion">Thời trang</option>
                                    <option value="Vegetables">Rau củ</option>
                                    <option value="Fruits">Trái cây</option>
                                    <option value="Meat">Thịt</option>
                                    <option value="Fish">Cá</option>
                                    <option value="Home">Gia dụng</option>
                                </select>
                                <div id="err-category" class="error-msg"></div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Giá bán (VND)</label>
                                <input type="number" name="price" id="price" class="form-control">
                                <div id="err-price" class="error-msg"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Số lượng kho</label>
                                <input type="number" name="quantity" id="quantity" class="form-control">
                                <div id="err-quantity" class="error-msg"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Mô tả sản phẩm</label>
                            <textarea name="description" id="description" class="form-control" rows="4"></textarea>
                            <div id="err-description" class="error-msg"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold text-primary">Ảnh hiện tại:</label>
                            <div id="oldImages" class="d-flex gap-2 flex-wrap border p-2 bg-light rounded"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Tải ảnh mới (Sẽ thay thế ảnh cũ)</label>
                            <input type="file" id="imageFiles" class="form-control" multiple accept="image/*">
                            <div id="newPreview" class="d-flex gap-2 mt-2 flex-wrap"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4" id="btnSave">
                                <i class="fa fa-save me-1"></i> Lưu thay đổi
                            </button>
                            <a href="productManagement.html" class="btn btn-outline-secondary">Quay lại</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    const token = sessionStorage.getItem("token");
    const username = sessionStorage.getItem("username");
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    if (!token || !productId) window.location.href = "productManagement.html";
    document.getElementById("usernameDisplay").innerText = `Xin chào, ${username}`;

    // 1. Fetch dữ liệu cũ
    async function loadProductData() {
        try {
            const res = await fetch(`http://localhost:8080/api/user/products/${productId}`, {
                headers: { Authorization: "Bearer " + token }
            });

            if (!res.ok) {
                alert(res.status === 404 ? "Sản phẩm không tồn tại!" : "Lỗi lấy dữ liệu!");
                window.location.href = "productManagement.html";
                return;
            }

            const result = await res.json();
            const p = result.data;

            document.getElementById("name").value = p.name;
            document.getElementById("category").value = p.category;
            document.getElementById("price").value = p.price;
            document.getElementById("quantity").value = p.quantity;
            document.getElementById("description").value = p.description;

            const statusToggle = document.getElementById("statusToggle");
            statusToggle.checked = (p.status === 'ACTIVE');
            updateStatusLabel(statusToggle.checked);

            const oldContainer = document.getElementById("oldImages");
            oldContainer.innerHTML = "";
            p.imageUrls.forEach(url => {
                oldContainer.innerHTML += `<img src="${url}" class="old-img">`;
            });
        } catch (err) {
            alert("Lỗi kết nối khi tải dữ liệu!");
        }
    }

    function updateStatusLabel(isActive) {
        const label = document.getElementById("statusLabel");
        label.innerText = isActive ? "Đang bán (ACTIVE)" : "Ngừng bán (INACTIVE)";
        label.className = isActive ? "form-check-label fw-bold ms-2 text-success" : "form-check-label fw-bold ms-2 text-danger";
    }

    document.getElementById("statusToggle").addEventListener("change", (e) => updateStatusLabel(e.target.checked));

    // 2. Preview ảnh mới
    document.getElementById("imageFiles").addEventListener("change", e => {
        const preview = document.getElementById("newPreview");
        preview.innerHTML = "";
        [...e.target.files].forEach(file => {
            const reader = new FileReader();
            reader.onload = ev => {
                const img = document.createElement("img");
                img.src = ev.target.result;
                img.className = "preview-img border-warning border-2";
                preview.appendChild(img);
            };
            reader.readAsDataURL(file);
        });
    });

    // 3. Xử lý Submit Update (Tương tự file Add)
    document.getElementById("updateForm").addEventListener("submit", async e => {
        e.preventDefault();

        // Ẩn các lỗi cũ
        document.querySelectorAll(".error-msg").forEach(el => el.style.display = "none");

        const btn = document.getElementById("btnSave");
        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Đang xử lý...';

        const formData = new FormData(e.target);
        const files = document.getElementById("imageFiles").files;
        [...files].forEach(f => formData.append("files", f));

        const statusValue = document.getElementById("statusToggle").checked ? "ACTIVE" : "INACTIVE";
        formData.append("status", statusValue);

        try {
            const res = await fetch(`http://localhost:8080/api/user/products/${productId}`, {
                method: "PUT",
                headers: { Authorization: "Bearer " + token },
                body: formData
            });

            const result = await res.json();

            if (res.ok) {
                alert("Cập nhật sản phẩm thành công!");
                window.location.href = "productManagement.html";
            } else if (result.data) {
                // Hiển thị lỗi từ result.data (Map lỗi từ Backend)
                Object.keys(result.data).forEach(key => {
                    const errorEl = document.getElementById(`err-${key}`);
                    if (errorEl) {
                        errorEl.innerText = result.data[key];
                        errorEl.style.display = "block";
                    }
                });
            } else {
                alert(result.message || "Đã xảy ra lỗi khi cập nhật!");
            }
        } catch (err) {
            alert("Không kết nối được server!");
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    });

    loadProductData();
</script>
</body>
</html>
