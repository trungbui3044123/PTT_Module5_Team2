<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detail</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .carousel-item img {
            height: 400px;
            object-fit: contain;
            background-color: #f8f9fa;
        }

        .info-label {
            font-weight: 600;
            color: #6c757d;
        }
    </style>
</head>
<body>

<main>
    <div class="container-fluid">
        <div class="row">

            <!-- ===== SIDEBAR ===== -->
            <div class="col-md-3 col-lg-2 bg-dark text-white min-vh-100 p-3">
                <h2 class="text-center mb-4">Admin Panel</h2>

                <ul class="nav flex-column">
                    <li class="nav-item mb-2">
                        <a href="index.html" class="nav-link text-white">
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item mb-2">
                        <a href="productManagement.html" class="nav-link text-white active">
                            Product Management
                        </a>
                    </li>

                    <li class="nav-item mt-3">
                        <a href="../../Login.html" class="btn btn-danger w-100">
                            Logout
                        </a>
                    </li>
                </ul>
            </div>

            <!-- ===== CONTENT ===== -->
            <div class="col-md-9 col-lg-10 p-4">

                <div class="d-flex justify-content-end mb-3">
                    <p class="fw-semibold text-secondary mb-0" id="usernameDisplay"></p>
                </div>

                <h2 class="fw-bold mb-4">Chi tiết sản phẩm</h2>

                <div class="card shadow-sm p-4">
                    <div class="row">

                        <!-- IMAGE CAROUSEL -->
                        <div class="col-md-6">

                            <div id="productCarousel" class="carousel slide" data-bs-ride="carousel">
                                <div class="carousel-inner" id="carouselInner">
                                    <!-- ảnh sẽ render ở đây -->
                                </div>

                                <button class="carousel-control-prev" type="button"
                                        data-bs-target="#productCarousel" data-bs-slide="prev">
                                    <span class="carousel-control-prev-icon"></span>
                                </button>

                                <button class="carousel-control-next" type="button"
                                        data-bs-target="#productCarousel" data-bs-slide="next">
                                    <span class="carousel-control-next-icon"></span>
                                </button>
                            </div>

                        </div>

                        <!-- PRODUCT INFO -->
                        <div class="col-md-6">

                            <h3 id="name" class="fw-bold mb-3"></h3>

                            <p>
                                <span class="info-label">Danh mục:</span>
                                <span id="category"></span>
                            </p>

                            <p>
                                <span class="info-label">Giá:</span>
                                <span id="price" class="text-danger fw-semibold"></span>
                            </p>

                            <p>
                                <span class="info-label">Số lượng:</span>
                                <span id="quantity"></span>
                            </p>

                            <p>
                                <span class="info-label">Trạng thái:</span>
                                <span id="status"></span>
                            </p>

                            <hr>

                            <p>
                                <span class="info-label">Mô tả:</span>
                            </p>
                            <p id="description"></p>

                            <a href="productManagement.html" class="btn btn-outline-secondary">
                                <i class="fa fa-arrow-left me-1"></i> Quay lại
                            </a>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const token = sessionStorage.getItem("token");
    const username = sessionStorage.getItem("username");
    const role = sessionStorage.getItem("role");

    if (!token || role !== "SUPPLIER") {
        window.location.href = "../../Login.html";
    }

    document.getElementById("usernameDisplay").innerText = `Xin chào, ${username}`;

    const API_BASE = "http://localhost:8080/api/user/products";

    document.addEventListener("DOMContentLoaded", () => {
        const productId =
            new URLSearchParams(window.location.search).get("id");
        if (!productId) {
            alert("Không tìm thấy sản phẩm");
            return;
        }
        loadProductDetail(productId);
    });

    async function loadProductDetail(id) {
        const response = await fetch(`${API_BASE}/${id}`, {
            headers: {
                Authorization: "Bearer " + token
            }
        });
        const res = await response.json();
        renderProduct(res.data);
    }

    function renderProduct(p) {
        document.getElementById("name").innerText = p.name ?? "N/A";
        document.getElementById("category").innerText = p.category ?? "N/A";
        document.getElementById("price").innerText = p.price ? p.price.toLocaleString("vi-VN") + " VND" : "0 VND";
        document.getElementById("quantity").innerText = p.quantity ?? 0;
        document.getElementById("status").innerHTML =
            `<span class="badge bg-${p.status === 'ACTIVE' ? 'success' : 'danger'}">
                ${p.status ?? "UNKNOWN"}
            </span>`;
        document.getElementById("description").innerText = p.description ?? "Không có mô tả";

        renderCarousel(p.imageUrls);
    }

    function renderCarousel(images) {
        const carouselInner =
            document.getElementById("carouselInner");
        if (!images || images.length === 0) {
            carouselInner.innerHTML = `
                <div class="carousel-item active">
                    <img src="https://via.placeholder.com/600x400"
                         class="d-block w-100">
                </div>`;
            return;
        }
        carouselInner.innerHTML = images.map((img, index) => `
            <div class="carousel-item ${index === 0 ? "active" : ""}">
                <img src="${img}" class="d-block w-100">
            </div>
        `).join("");
    }
</script>
</body>
</html>
