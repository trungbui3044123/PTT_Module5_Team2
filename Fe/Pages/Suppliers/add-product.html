<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier - Add Product</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .error-msg {
            color: #dc3545;
            font-size: 0.875em;
            margin-top: 0.25rem;
            display: none;
        }
        .preview-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

<main>
    <div class="container-fluid">
        <div class="row">

            <!-- ===== SIDEBAR (GIỐNG index.html) ===== -->
            <div class="col-md-3 col-lg-2 bg-dark text-white min-vh-100 p-3">
                <h2 class="text-center mb-4">Supplier Panel</h2>

                <ul class="nav flex-column">
                    <li class="nav-item mb-2">
                        <a href="index.html" class="nav-link text-white">
                            Dashboard
                        </a>
                    </li>

<!--                    <li class="nav-item mb-2">-->
<!--                        <a href="./add-product.html" class="nav-link text-white active">-->
<!--                            Add Product-->
<!--                        </a>-->
<!--                    </li>-->

                    <li class="nav-item mb-2">
                        <a href="productManagement.html" class="nav-link text-white active">
                            Product Management
                        </a>
                    </li>

                    <li class="nav-item mb-2">
                        <a href="orderManagement.html" class="nav-link text-white">
                            Order Management
                        </a>
                    </li>

                    <li class="nav-item mb-2">
                        <a href="couponManagement.html" class="nav-link text-white">Coupon Management</a>
                    </li>

                    <li class="nav-item mb-2">
                        <a href="reviewManagement.html" class="nav-link text-white">
                            Review Management
                        </a>
                    </li>

                    <li class="nav-item mt-3">
                        <a href="../../Login.html" class="btn btn-danger w-100">
                            Logout
                        </a>
                    </li>
                </ul>
            </div>

            <!-- ===== CONTENT ===== -->
            <div class="col-md-9 col-lg-10 p-4">

                <!-- USER -->
                <div class="d-flex justify-content-end mb-3">
                    <p class="fw-semibold text-secondary mb-0" id="usernameDisplay"></p>
                </div>

                <!-- ADD PRODUCT FORM -->
                <div class="card shadow-sm p-4">
                    <h2 class="fw-bold mb-4">Thêm sản phẩm mới</h2>

                    <form id="addRequestForm">
                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label class="form-label fw-bold">Tên sản phẩm</label>
                                <input type="text" name="name" class="form-control">
                                <div id="err-name" class="error-msg"></div>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">Loại sản phẩm</label>
                                <select name="category" class="form-select">
                                    <option value="">-- Chọn chủng loại --</option>
                                    <option value="Electronics">Điện tử</option>
                                    <option value="Fashion">Thời trang</option>
                                    <option value="Vegetables">Rau củ</option>
                                    <option value="Fruits">Trái cây</option>
                                    <option value="Meat">Thịt</option>
                                    <option value="Fish">Cá</option>
                                    <option value="Home">Gia dụng</option>
                                </select>
                                <div id="err-category" class="error-msg"></div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Giá bán (VND)</label>
                                <input type="number" name="price" class="form-control">
                                <div id="err-price" class="error-msg"></div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Số lượng kho</label>
                                <input type="number" name="quantity" class="form-control">
                                <div id="err-quantity" class="error-msg"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Mô tả sản phẩm</label>
                            <textarea name="description" class="form-control" rows="4"></textarea>
                            <div id="err-description" class="error-msg"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Hình ảnh sản phẩm</label>
                            <input type="file" id="imageFiles" class="form-control" multiple accept="image/*">
                            <div id="imagePreview" class="d-flex gap-2 mt-2 flex-wrap"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4" id="btnSubmit">
                                <i class="fa fa-save me-2"></i>Lưu sản phẩm
                            </button>
                            <button type="reset" class="btn btn-outline-secondary">
                                Làm mới
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>
</main>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const token = sessionStorage.getItem("token");
    const username = sessionStorage.getItem("username");
    const role = sessionStorage.getItem("role");

    if (!token || role !== "SUPPLIER") {
        window.location.href = "../../Login.html";
    }

    document.getElementById("usernameDisplay").innerText = `Xin chào, ${username}`;

    // Preview image
    document.getElementById("imageFiles").addEventListener("change", e => {
        const preview = document.getElementById("imagePreview");
        preview.innerHTML = "";
        [...e.target.files].forEach(file => {
            const reader = new FileReader();
            reader.onload = ev => {
                const img = document.createElement("img");
                img.src = ev.target.result;
                img.className = "preview-img";
                preview.appendChild(img);
            };
            reader.readAsDataURL(file);
        });
    });

    // Submit form (GIỮ NGUYÊN LOGIC)
    document.getElementById("addRequestForm").addEventListener("submit", async e => {
        e.preventDefault();

        document.querySelectorAll(".error-msg").forEach(el => el.style.display = "none");

        const btn = document.getElementById("btnSubmit");
        btn.disabled = true;
        btn.innerHTML = "Đang xử lý...";

        const formData = new FormData(e.target);
        const files = document.getElementById("imageFiles").files;

        if (files.length === 0) {
            alert("Vui lòng chọn ít nhất 1 ảnh");
            btn.disabled = false;
            btn.innerHTML = "Lưu sản phẩm";
            return;
        }

        [...files].forEach(f => formData.append("files", f));

        try {
            const res = await fetch("http://localhost:8080/api/user/products/add", {
                method: "POST",
                headers: { Authorization: "Bearer " + token },
                body: formData
            });

            const result = await res.json();

            if (res.ok) {
                alert("Thêm sản phẩm thành công!");
                window.location.href = "productManagement.html";
            } else if (result.data) {
                Object.keys(result.data).forEach(k => {
                    const el = document.getElementById(`err-${k}`);
                    if (el) {
                        el.innerText = result.data[k];
                        el.style.display = "block";
                    }
                });
            } else {
                alert(result.message || "Lỗi hệ thống");
            }
        } catch {
            alert("Không kết nối được server");
        } finally {
            btn.disabled = false;
            btn.innerHTML = "Lưu sản phẩm";
        }
    });
</script>

</body>
</html>
