<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Login</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div
      class="container d-flex justify-content-center align-items-center vh-100"
    >
      <div class="card shadow p-4" style="width: 380px">
        <h2 class="text-center mb-3">Login </h2>

        <div
          id="error"
          class="alert alert-danger text-center py-2"
          style="display: none"
        >
           username or password not valid
        </div>

        <form id="loginForm">
          <!-- Username -->
          <div class="mb-3">
            <label for="username" class="form-label">User's name *</label>
            <input
              type="text"
              id="username"
              name="username"
              class="form-control"
              required
            />
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label for="password" class="form-label">User's password *</label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              required
            />
          </div>

          <button type="submit" class="btn btn-dark w-100">Login</button>
        </form>
        <div class="d-flex flex-column align-items-center mt-3">
          <a href="./Pages/Users/ForgotPassword.html" class="btn btn-link"
            >Forgot Password</a
          >
          <a href="./Pages/Users/registerUser.html" class="btn btn-link"
            >Create new account</a
          >
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      sessionStorage.removeItem("role");
      sessionStorage.removeItem("token");
      sessionStorage.removeItem("username");

      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const data = {
            username: document.getElementById("username").value,
            password: document.getElementById("password").value,
          };

          fetch("http://localhost:8080/api/public/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          })
            .then((result) => result.json())
            .then((resp) => {
              console.log(resp);

              if (resp.status === 200) {
                // Lưu token nếu BE trả về
                if (resp.data.jwt) {
                  sessionStorage.setItem("token", resp.data.jwt);
                  sessionStorage.setItem("username", resp.data.username);
                  sessionStorage.setItem("role", resp.data.role);
                }
                if ("ADMIN" === resp.data.role && resp.data.enabled) {
                  window.location.href = "./Pages/Admin/index.html";
                } else if (!resp.data.enabled) {
                  document.getElementById("error").innerHTML =
                    "User has been banned.Can not not login";
                } else if("SUPPLIER" === resp.data.role && resp.data.enabled){
                  window.location.href = "./Pages/Suppliers/index.html";
                }
                else {
                  window.location.href = "./index.html";
                }
              } else {
                console.log("Lỗi BE:", resp.message);
                const error = document.getElementById("error");
                error.style.display = "block";
                error.innerText = resp.message;
              }
            })
            .catch((err) => {
              const error = document.getElementById("error");
              error.style.display = "block";
            });
        });
    </script>
  </body>
</html>
